appId: com.seuput.ompdesk
# Display name: the bundle (OMPdesk.app), menu bar and Dock read it. Identifiers
# stay lowercase: appId, userData and the keychain item, and the artifact names
# below. The release renames the DMG to `ompdesk-mac-arm64.dmg`; the versioned
# names matter to the legacy update feed (LEGACY_UPDATE_FEED in release.yml),
# whose v0.17.x readers look them up by exact name.
productName: OMPdesk
directories:
  buildResources: resources
  output: dist

# macOS is packaged by scripts/package-mac.ts (`bun run package:mac`), not by electron-builder's Electron pack: it
# assembles OMPdesk.app from the CEF shell (native/ompdesk/crates/shell), Node and the app's resources, checks it with
# scripts/after-pack.cjs, signs it with scripts/mac-sign.cjs and calls `electron-builder --prepackaged` for the DMG
# only. In that mode electron-builder neither packs nor signs nor runs `afterPack`: this file supplies the DMG's layout
# (`dmg`), the legacy ZIP's name (`mac.artifactName`) and the identity (`appId`, `productName`). The bundle's Info.plist
# (the `omp://` scheme, the privacy prompts that name the app, the ATS policy) is scripts/mac-bundle-info.cjs.
# electron-builder wants an engine version for its logs; the engine is the CEF release
# native/ompdesk/crates/shell/cef-pin.json pins.
electronVersion: 156.0.26
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Names the ZIP the legacy feed builds (`--mac dmg zip`); the DMG has its own below.
  artifactName: ompdesk-${version}-${arch}-mac.${ext}
  # Signing is scripts/package-mac.ts's own (OMPdesk's pinned certificate), before the DMG is laid out.
  identity: null
  target:
    - target: dmg
      arch: [arm64]

dmg:
  # The mounted volume's icon and the window picture, generated by bun run gen:icons. The picture is 540x380 (@2x
  # in the TIFF); its arrow sits between the two items at y 220.
  icon: icon.icns
  background: resources/dmg-background.tiff
  artifactName: ompdesk-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: SeuPut0705
  repo: ompdesk

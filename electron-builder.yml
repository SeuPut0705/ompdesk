appId: com.seuput.ompdesk
# Display name: the bundle (OMPdesk.app), menu bar and Dock read it. Identifiers
# stay lowercase: appId, userData and the keychain item (app.setName in
# src/main/index.ts), and the artifact names below. The release renames the DMG
# to `ompdesk-mac-arm64.dmg`; the versioned names matter to the legacy update
# feed (LEGACY_UPDATE_FEED in release.yml), whose v0.17.x readers look them up
# by exact name.
productName: OMPdesk
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
  # scripts/build-cache.ts's reuse stamp; the app never reads it.
  - "!out/.build-stamp.json"
extraResources:
  - from: resources/gui-bridge
    to: gui-bridge
  - from: resources/omp-builtin
    to: omp-builtin
  # OMPdesk's own MIT license, the generated third-party notices (bun run gen:licenses;
  # they carry the attribution of the vendored code), the license texts of vendored code
  # (LICENSES/) and Electron's Chromium notices, which electron-builder does not copy
  # into a macOS bundle.
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: LICENSES
    to: LICENSES
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
# `omp://` deep links only work if LaunchServices sees CFBundleURLTypes, which
# this block is the only thing that writes. Without it `open-url` never fires in
# an installed build and the handler in src/main/deep-link.ts is dead code.
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Names the ZIP the legacy feed builds (`--mac dmg zip`); the DMG has its own below.
  artifactName: ompdesk-${version}-${arch}-mac.${ext}
  # "-" lets electron-builder hand signing to scripts/mac-sign.cjs without an
  # Apple identity. That hook signs with OMPdesk's own pinned self-signed
  # certificate (scripts/mac-signing.json), so macOS privacy grants survive
  # updates; with no certificate available it seals the bundle ad-hoc.
  identity: "-"
  sign: scripts/mac-sign.cjs
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OMPdesk uses the microphone for voice dictation in the composer.
    # Electron's stock bundle asks for camera and Bluetooth with text that names no
    # app; OMPdesk never calls either API, so the prompt a user might see stays honest.
    NSCameraUsageDescription: OMPdesk does not use the camera.
    NSBluetoothAlwaysUsageDescription: OMPdesk does not use Bluetooth.
    NSBluetoothPeripheralUsageDescription: OMPdesk does not use Bluetooth.
    # Two origins only: the loopback stats server and GitHub releases over TLS.
    # Declaring that is stricter than the default, so an accidental remote
    # cleartext request cannot start working because some build set
    # NSAllowsArbitraryLoads.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  notarize: false

dmg:
  artifactName: ompdesk-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false


publish:
  provider: github
  owner: SeuPut0705
  repo: ompdesk

# Electron's locale files: only en-US (Chromium's hard fallback; a build without
# `en-US.pak` aborts the renderer at startup, issue #12) and ko, the UI's other
# language. electron-builder keeps a file whose name equals a listed language or
# prefixes it (`en.lproj` here), so "en" alone would delete them all.
# scripts/after-pack.cjs fails the package unless exactly these survive. Saves
# ~42 MB unpacked (~10 MB of the DMG). Chromium's locale is then en-US for other
# system languages; the spellchecker and the Preview's Accept-Language follow
# the system's languages instead (src/main/system-languages.ts).
electronLanguages:
  - en-US
  - ko

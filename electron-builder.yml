appId: com.seuput.ompdesk
productName: ompdesk
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/gui-bridge
    to: gui-bridge
# `omp://` deep links only work if LaunchServices sees CFBundleURLTypes, which
# this block is the only thing that writes. Without it `open-url` never fires in
# an installed build and the handler in src/main/deep-link.ts is dead code.
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Seal the complete bundle even when no Developer ID certificate is available.
  # This preserves macOS's user-override flow instead of presenting the app as damaged.
  identity: "-"
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: ompdesk uses the microphone for voice dictation in the composer.
    # Electron's stock bundle asks for camera and Bluetooth with text that names no
    # app; ompdesk never calls either API, so the prompt a user might see stays honest.
    NSCameraUsageDescription: ompdesk does not use the camera.
    NSBluetoothAlwaysUsageDescription: ompdesk does not use Bluetooth.
    NSBluetoothPeripheralUsageDescription: ompdesk does not use Bluetooth.
    # Two origins only: the loopback stats server and GitHub releases over TLS.
    # Declaring that is stricter than the default, so an accidental remote
    # cleartext request cannot start working because some build set
    # NSAllowsArbitraryLoads.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  notarize: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false


publish:
  provider: github
  owner: SeuPut0705
  repo: ompdesk

# NO `electronLanguages` here on purpose — see the note in
# electron-builder.win.yml: exact-basename matching deleted every `locales/*.pak`,
# and the missing `en-US.pak` makes Chromium abort the renderer (issue #12).

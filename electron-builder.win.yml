appId: com.seuput.ompdesk
# Display name (exe, shortcuts, Apps list); asset names stay lowercase for the updater.
productName: OMPdesk
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
  # scripts/build-cache.ts's reuse stamp; the app never reads it.
  - "!out/.build-stamp.json"
extraResources:
  - from: resources/gui-bridge
    to: gui-bridge
  - from: resources/omp-builtin
    to: omp-builtin
  # Third-party attribution (Apache-2.0 section 4) and the license texts it names.
  - from: NOTICE
    to: NOTICE
  - from: LICENSES
    to: LICENSES
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Windows packages are currently unsigned; electron-updater must not require
  # a stable certificate identity for an update check.
  verifyUpdateCodeSignature: false

# One click, per user: a double-click installs into %LOCALAPPDATA%\Programs\ompdesk
# (or the folder an earlier per-user install recorded in HKCU) with no page,
# no question and no UAC; the window shows one progress bar, then OMPdesk
# starts. resources/installer.nsh removes an all-users copy the old assisted
# installer may have left in Program Files (the only case that asks anything).
# `gh workflow run ci.yml -f installer_check=true` checks it on windows-latest.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMPdesk
  include: resources/installer.nsh
  artifactName: ompdesk-${version}-setup.${ext}

publish:
  provider: github
  owner: SeuPut0705
  repo: ompdesk

# Electron's locale files: only en-US (Chromium's hard fallback; without
# `en-US.pak` the renderer aborts at startup and the window stays blank —
# issue #12, when `electronLanguages: [en]` matched no file and deleted all 55)
# and ko, the UI's other language. electron-builder keeps a pak whose name
# equals a listed language; scripts/after-pack.cjs fails the package unless
# exactly en-US.pak and ko.pak survive. Saves 43 MB unpacked (~7.6 MB of the
# setup). Chromium's locale is then en-US for other system languages; the
# spellchecker and the Preview's Accept-Language follow the system's languages
# instead (src/main/system-languages.ts).
electronLanguages:
  - en-US
  - ko

appId: com.seuput.ompdesk
# Display name (exe, shortcuts, Apps list); asset names stay lowercase for the updater.
productName: OMPdesk
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist

# The app is the Rust CEF shell (native/ompdesk/crates/shell), not Electron. electron-builder still does what it did
# for the Electron app (the NSIS one-click per-user installer with the same identity: appId → uninstall key
# e6f1f351-4346-5a64-a104-9a02672ef1bc, `InstallLocation`, shortcuts, the `omp` protocol, resources/installer.nsh,
# the exe's icon and version info) over a custom `electronDist`: the folder `bun run build:shell` stages, holding
# `ompdesk-shell.exe`, CEF's runtime files and its two locales. Nothing of Electron is downloaded. `afterExtract`
# (scripts/after-pack.cjs) names the exe `electron.exe` as electron-builder expects, and electron-builder renames it
# OMPdesk.exe: a framework named anything but "electron" would lay the app out beside the exe, not under resources/.
# A package that comes out other than the shell's layout fails `afterPack` (the same file).
electronDist: resources/ompdesk-shell/win32-x64
afterExtract: scripts/after-pack.cjs
# electron-builder wants a version to look up and to hash into its signing cache; the engine is the CEF release
# native/ompdesk/crates/shell/cef-pin.json pins.
electronVersion: 156.0.26
# No native add-on is rebuilt: the app's dependencies are bundled into out/ and node_modules is not packed.
npmRebuild: false
# The shell starts <resources>/node/node.exe on <resources>/app/out/main/index.js: a plain folder, not an archive
# Node's own loader would have to be taught (Electron's asar patches are not there).
asar: false
files:
  - out/**/*
  - "!node_modules/**/*"
  # scripts/build-cache.ts's reuse stamp; the app never reads it.
  - "!out/.build-stamp.json"
  # scripts/out-snapshot.ts's marker of the build a Playwright run last used; the app never reads it.
  - "!out/.used"
extraResources:
  - from: resources/gui-bridge
    to: gui-bridge
  # Node 24 LTS, the runtime of the TypeScript main that is left (scripts/node-runtime-pin.json: version and SHA-256
  # per platform). bun run build:node fills the gitignored directory with node.exe, Node's LICENSE and its build
  # record; scripts/after-pack.cjs checks them against the pin.
  - from: resources/node/win32-x64
    to: node
  # OMPdesk's own Rust built from native/ompdesk (the `ompdesk` CLI) and its build record. bun run build:native
  # fills the gitignored directory; scripts/after-pack.cjs checks the binaries against the record.
  - from: resources/ompdesk-bin/win32-x64
    to: ompdesk-bin
  - from: resources/omp-builtin
    to: omp-builtin
  # The memory binary built from native/memory and its build record, nothing else.
  # bun run build:memory fills the gitignored directory; scripts/after-pack.cjs checks the binary against the record.
  - from: resources/ai-memory-bin/win32-x64
    to: ai-memory-bin
  # agent-desktop, the default computer-use engine, at the release scripts/agent-desktop-pin.json pins, with
  # upstream's LICENSE and the build record. bun run build:agent-desktop fills the gitignored directory;
  # scripts/after-pack.cjs checks it against the record and the pin.
  - from: resources/agent-desktop-bin/win32-x64
    to: agent-desktop-bin
  # The window, About panel and Windows notification icon (the shell's chrome module), generated by bun run gen:icons.
  - from: resources/brand/app-icon.png
    to: app-icon.png
  # OMPdesk's own Apache-2.0 license and NOTICE, the generated third-party notices (bun run
  # gen:licenses; they carry the attribution of the vendored code), the license texts of
  # vendored code (LICENSES/) and CEF's: Chromium's notices (CEF's CREDITS.html, as LICENSES.chromium.html) and
  # CEF's own licence, which bun run stage:cef-licenses takes out of the CEF archive.
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: LICENSES
    to: LICENSES
  - from: resources/shell-licenses/win32-x64/LICENSES.chromium.html
    to: LICENSES.chromium.html
  - from: resources/shell-licenses/win32-x64/LICENSE.cef.txt
    to: LICENSE.cef.txt
protocols:
  - name: omp
    schemes:
      - omp
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Windows packages are currently unsigned; electron-updater must not require
  # a stable certificate identity for an update check.
  verifyUpdateCodeSignature: false

# One click, per user: a double-click installs into %LOCALAPPDATA%\Programs\ompdesk
# (or the folder an earlier per-user install recorded in HKCU) with no page,
# no question and no UAC; the window shows one progress bar, then OMPdesk
# starts. resources/installer.nsh removes an all-users copy the old assisted
# installer may have left in Program Files (the only case that asks anything).
# `gh workflow run ci.yml -f installer_check=true` checks it on windows-latest.
# The update from the Electron app (v0.127.0) is this same installer run by that app's own NSIS flow, over the same
# folder and uninstall entry: keep the identity (appId, no `guid`, no `perMachine`, no `oneClick: false`) as it is.
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMPdesk
  include: resources/installer.nsh
  artifactName: ompdesk-${version}-setup.${ext}

publish:
  provider: github
  owner: seuput-inc
  repo: ompdesk

# CEF's locale files: only en-US (Chromium's hard fallback; without `en-US.pak` the renderer aborts at startup and
# the window stays blank, issue #12) and ko, the UI's other language. The shell build already stages only these two;
# electron-builder keeps a pak whose name equals a listed language, and scripts/after-pack.cjs fails the package
# unless exactly en-US.pak and ko.pak survive. Chromium's locale is then en-US for other system languages; the
# spellchecker and the Preview's Accept-Language follow the system's languages instead (src/main/system-languages.ts).
electronLanguages:
  - en-US
  - ko

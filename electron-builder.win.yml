appId: com.seuput.ompdesk
# Display name (exe, shortcuts, Apps list); asset names stay lowercase for the updater.
productName: OMPdesk
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
  # scripts/build-cache.ts's reuse stamp; the app never reads it.
  - "!out/.build-stamp.json"
extraResources:
  - from: resources/gui-bridge
    to: gui-bridge
  - from: resources/omp-builtin
    to: omp-builtin
  # Third-party attribution (Apache-2.0 section 4) and the license texts it names.
  - from: NOTICE
    to: NOTICE
  - from: LICENSES
    to: LICENSES
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Windows packages are currently unsigned; electron-updater must not require
  # a stable certificate identity for an update check.
  verifyUpdateCodeSignature: false

# One click, per user: a double-click installs into %LOCALAPPDATA%\Programs\ompdesk
# (or the folder an earlier per-user install recorded in HKCU) with no page,
# no question and no UAC; the window shows one progress bar, then OMPdesk
# starts. resources/installer.nsh removes an all-users copy the old assisted
# installer may have left in Program Files (the only case that asks anything).
# `gh workflow run ci.yml -f installer_check=true` checks it on windows-latest.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMPdesk
  include: resources/installer.nsh
  artifactName: ompdesk-${version}-setup.${ext}

publish:
  provider: github
  owner: SeuPut0705
  repo: ompdesk

# NO `electronLanguages` here on purpose: electron-builder's option compares the
# list against Electron's `locales/*.pak` basenames with an EXACT match (after
# lowercasing), so `electronLanguages: [en]` — which this repo had — matched
# nothing (Electron ships `en-US.pak`/`en-GB.pak`, never `en.pak`) and deleted
# ALL 55 paks. Chromium then aborts the renderer at startup: `en-US.pak` is its
# hardcoded fallback locale file, and without it the window renders for an
# instant and stays blank forever — issue #12's Windows blank screen, reproduced
# on the shipped 0.9.14 payloads (empty `locales/` → crash, same binaries with
# paks → renders). Keeping Electron's stock locale set intact is both the
# correct and the maintenance-free option; trimming languages here breaks
# Chinese users' Chromium UI strings too.

[package]
name = "handoff-setup"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.55"
walkdir = "2"

[profile.release]
opt-level = "s"
strip = true
lto = true

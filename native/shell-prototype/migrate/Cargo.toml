[package]
name = "shell-migrate"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "migrate-check"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
# Chromium's Local Storage is a LevelDB with snappy blocks; read from a copy so Electron's files stay as they are.
rusty-leveldb = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[package]
name = "ompdesk-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ompdesk_core"
path = "src/lib.rs"

[[bin]]
name = "ompdesk-core"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The process's base: requests run concurrently (a slow listing never holds a small read behind it). Only the
# features used: `process` and `time` run git with its timeout, `macros` joins and races a git's pipes, its exit
# and its kill, `net` is the control socket (a Unix socket, a Windows named pipe).
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "process", "time", "macros", "net"] }
# The wire: one JSON object per line. `raw_value` hands a request's params to its handler unparsed.
# `float_roundtrip` reads a number as its digits say, as `JSON.parse` does: the default parse is best effort (one
# time in ten with sub-millisecond digits one bit off), and a time main sends or a kept file holds is compared `==`.
# `preserve_order` keeps an object's keys as written (Tailscale's peers are listed in their document's order, as
# JavaScript listed them); the CLI crate asks for it too, so every build of the workspace already had it.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip", "preserve_order"] }
# Listings sort as the page's `Intl.Collator(locale, { numeric: true })` does: ICU's collation, same algorithm and data.
icu_collator = "2"
# The folder picker's filter lowercases as `toLocaleLowerCase()` does (Turkish, Azeri and Lithuanian rules included).
icu_casemap = "2"
icu_locale_core = "2"
# The history's commit links read a remote's URL as node's `URL` does: the WHATWG URL standard (host, IDNA, path).
url = "2"

[target.'cfg(unix)'.dependencies]
# errno values for node's error codes (`ENOENT: no such file or directory, stat '…'`), and the SIGTERM that asks a
# git past its timeout or its output cap to end (`sys.rs`).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The sessions tree's one recursive watch (`sessions/source.rs`). FSEvents is CoreFoundation and CoreServices calls,
# a run loop thread and a C callback: unsafe code no machine but a Mac can run, which `sys.rs` would otherwise carry
# untested from the Windows computers that also develop this crate. notify (CC0-1.0; on macOS it links
# objc2-core-foundation, objc2-core-services, notify-types, bitflags, log, walkdir and same-file) makes one
# FSEventStream for the one path watched (file events, no latency) and reports the system's "events were dropped" as
# a rescan. Windows reads ReadDirectoryChangesW itself (`sys.rs`): notify's backend there reports nothing of a buffer
# overflow and silently stops watching a deleted root (read in 8.2.2's `windows.rs`).
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
# A rename's "is the target the source itself" (a case-only rename) needs the file's identity, which std keeps
# unstable on Windows (`windows_by_handle`).
same-file = "1"

[dev-dependencies]
# `test-util`: the control socket's waits and timeouts are tested on a paused clock, as the TypeScript's were on fake timers.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "test-util"] }

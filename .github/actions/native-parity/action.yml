# The vitest files that run main's moved code through the real ompdesk-core binary (the parity suites of
# native-rust's ledger), for macOS: no other job runs vitest there, so the core's macOS paths (spawn, the process
# group's kill, git and gh from the core, `sysctl` and `ps`) ran nowhere before a release. The one list
# ci.yml's and release.yml's `mac-native` jobs share. Run it after the install action (it stages the binary) and omp
# (session-index.test.ts reads stock omp's storage).
name: Native parity tests
description: vitest over the files that drive the real ompdesk-core binary.

runs:
  using: composite
  steps:
    - name: vitest over the real core
      shell: bash
      run: >-
        bunx vitest run --project=node
        src/main/core/process.test.ts
        src/main/agent-browsers.test.ts
        src/main/repo-lock-fence.test.ts
        src/main/session-index.test.ts
        src/main/memory-sampler.test.ts
        src/main/model-setup-runner.test.ts
        src/main/schedules.test.ts
        src/main/web/webhook.test.ts
        src/main/session-processes.test.ts
        src/main/setup/runner.test.ts
        src/main/control-socket/server.test.ts
        src/main/control-socket/router.test.ts
        src/main/control-socket/events.test.ts
        src/main/control-socket/cli.test.ts
        src/main/tailscale/cli.test.ts
        src/main/tailscale/locate.test.ts
        src/main/tailscale/service.test.ts
        src/main/tailscale/tailnet.test.ts
        src/main/ssh/*.test.ts
        src/main/ext-update/mcp.test.ts
        src/main/ext-update/classify.test.ts
        src/main/ext-update/running.test.ts
        src/main/ext-update/mcp-owner.test.ts
        src/main/ext-update/mcp-plans.test.ts
        src/main/ext-update/updater.test.ts
        src/main/github-auth/service.test.ts
        src/main/checkout-peers*.test.ts
        src/main/git-fingerprints*.test.ts
        src/main/ai-memory/client.test.ts
        src/main/ai-memory/freshness*.test.ts
        src/main/routines/*.test.ts
        src/main/local/autopilot*.test.ts
        src/main/local/git/changes.test.ts
        src/main/local/git/scm.test.ts
        src/main/local/git/worktree.test.ts
        src/main/local/git/worktree-seed.test.ts
        src/main/local/git/exec-gh.test.ts
        src/main/workspace-fs*.test.ts
        src/main/disk/*.test.ts

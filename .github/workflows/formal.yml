# Formal verification (TLA+/TLC through verify-all.ts) on hosted runners, on demand. A model check, its mutation
# runs and its stamp take minutes to hours of CPU, so they never run on a developer's machine:
#   gh workflow run formal.yml --ref <branch> -f only=<model id> [-f stamp=true]
#   gh run watch <run-id> --interval 120
# The run is split so its time is the longest single check, not their sum:
#   plan     lists the checks (every matrix run, the mutation baselines, every mutation) with shard.ts,
#   run      a strategy matrix of jobs (a long check has a runner to itself, short ones share, at most 256 jobs), each
#            writes the verdict files of its checks and uploads them; a check whose input digest was seen before takes
#            its verdict from the cache,
#   collect  prints the report verify-all prints, from the verdicts (the `@code` tags, the drift check and the stamp
#            run there as before),
#   publish  as before, serial per ref.
# The digest of a check is the model's text with its comments blanked (an `@code` tag edit changes nothing), the config,
# the TLC options, the pinned jars and the java; a stamp still needs a run of the new text, which then costs only
# the checks whose input changed. Caches belong to the branch they were made on and to main: dispatch this workflow
# on main once (no stamp) after a model change lands, and every branch that starts from it reuses the verdicts.
# With `stamp`, the updated formal/manifest.json is committed back to the dispatched branch as
# `chore(formal): stamp <ids> on <sha7>`. A stamp never lands on main directly: dispatch on a branch.
name: formal
run-name: ${{ format('formal {0} {1}{2}{3}', inputs.only || 'all', inputs.tier, inputs.stamp && ' stamp' || '', inputs.inspect_unit != '' && format(' inspect {0}', inputs.inspect_unit) || '') }}

on:
  workflow_dispatch:
    inputs:
      only:
        description: "One model id from formal/manifest.json (empty: every model of the tier)"
        type: string
        default: ""
      tier:
        description: "fast (the models marked fast) or deep (every model)"
        type: choice
        options: [fast, deep]
        default: fast
      stamp:
        description: "Stamp the models that passed and commit formal/manifest.json to this branch (never main)"
        type: boolean
        default: false
      skip_mutations:
        description: "Skip the mutation runs"
        type: boolean
        default: false
      inspect_unit:
        description: "Inspect one exact matrix-row unit (not a model verification or stamp)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.inspect_unit != '' && 'formal-inspect' || 'formal' }}-${{ github.ref }}-${{ inputs.only || 'all' }}${{ inputs.inspect_unit != '' && format('-{0}', inputs.inspect_unit) || '' }}
  cancel-in-progress: ${{ inputs.inspect_unit == '' }}

env:
  SKILL: resources/omp-builtin/formal/skills/ompdesk-formal-verify

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Guard inspection scope
        if: inputs.inspect_unit != ''
        env:
          ONLY: ${{ inputs.only }}
          STAMP: ${{ inputs.stamp }}
          SKIP_MUTATIONS: ${{ inputs.skip_mutations }}
        run: |
          if [ -z "$ONLY" ] || [ "$STAMP" = "true" ] || [ "$SKIP_MUTATIONS" != "true" ]; then
            echo "::error::inspect_unit requires only, stamp=false and skip_mutations=true."
            exit 1
          fi
      - name: Refuse a stamp on main
        if: inputs.stamp && github.ref == 'refs/heads/main'
        run: |
          echo "::error::A stamp lands through a branch: dispatch formal.yml on a branch, not main."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            formal
            resources/omp-builtin/formal
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # The plan fetches the pinned jars the first time; the check jobs only restore them.
      - name: TLC tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ompdesk/formal
          key: formal-tools-${{ runner.os }}-${{ hashFiles('resources/omp-builtin/formal/skills/ompdesk-formal-verify/assets/toolchain.json') }}
      - name: Plan the checks
        id: plan
        env:
          ONLY: ${{ inputs.only }}
          TIER: ${{ inputs.tier }}
          SKIP_MUTATIONS: ${{ inputs.skip_mutations }}
          INSPECT_UNIT: ${{ inputs.inspect_unit }}
        run: |
          args=(formal --tier "$TIER")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$SKIP_MUTATIONS" = "true" ] && args+=(--skip-mutations)
          [ -n "$INSPECT_UNIT" ] && args+=(--inspect-unit "$INSPECT_UNIT")
          bun "$SKILL/scripts/shard.ts" plan "${args[@]}" --github-output

  run:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.jobs != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            formal
            resources/omp-builtin/formal
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: TLC tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ompdesk/formal
          key: formal-tools-${{ runner.os }}-${{ hashFiles('resources/omp-builtin/formal/skills/ompdesk-formal-verify/assets/toolchain.json') }}
      # The key is the digest of this job's checks; a hit holds their verdicts, a miss is saved when the job ends.
      - name: Verdict cache
        if: inputs.inspect_unit == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .formal-verdict-cache
          key: formal-verdict-v1-${{ matrix.key }}
      - name: Check
        env:
          ONLY: ${{ inputs.only }}
          TIER: ${{ inputs.tier }}
          SKIP_MUTATIONS: ${{ inputs.skip_mutations }}
          UNITS: ${{ matrix.units }}
          INSPECT_UNIT: ${{ inputs.inspect_unit }}
        run: |
          args=(formal --tier "$TIER")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$SKIP_MUTATIONS" = "true" ] && args+=(--skip-mutations)
          cache=(--cache .formal-verdict-cache)
          out=verdicts
          if [ -n "$INSPECT_UNIT" ]; then
            args+=(--inspect-unit "$INSPECT_UNIT")
            cache=()
            out=runner-scratch/negative-verdicts
          fi
          bun "$SKILL/scripts/shard.ts" run "${args[@]}" --units "$UNITS" --out "$out" "${cache[@]}"
          if [ -n "$INSPECT_UNIT" ]; then
            test -s "$out/inspection/verdict.json"
            test -s "$out/inspection/summary.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.inspect_unit == ''
        with:
          name: formal-verdict-${{ matrix.id }}
          path: verdicts
          if-no-files-found: error
          retention-days: 3
      - name: Inspection summary
        if: ${{ always() && inputs.inspect_unit != '' }}
        run: |
          echo "Single-unit inspection only. This is not a model verification pass or stamp." >> "$GITHUB_STEP_SUMMARY"
          if [ -s runner-scratch/negative-verdicts/inspection/summary.json ]; then
            { echo '```json'; cat runner-scratch/negative-verdicts/inspection/summary.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "INCONCLUSIVE: no inspection summary was recorded." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload single-unit inspection
        if: ${{ always() && inputs.inspect_unit != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-unit-inspection
          path: runner-scratch/negative-verdicts/inspection/
          if-no-files-found: error
          retention-days: 3

  collect:
    needs: [plan, run]
    if: ${{ inputs.inspect_unit == '' && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.plan.outputs.jobs != '0'
        with:
          pattern: formal-verdict-*
          merge-multiple: true
          path: verdicts
      - name: Verify
        env:
          ONLY: ${{ inputs.only }}
          TIER: ${{ inputs.tier }}
          STAMP: ${{ inputs.stamp }}
          SKIP_MUTATIONS: ${{ inputs.skip_mutations }}
        run: |
          mkdir -p verdicts
          args=(formal --tier "$TIER")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$STAMP" = "true" ] && args+=(--stamp)
          [ "$SKIP_MUTATIONS" = "true" ] && args+=(--skip-mutations)
          set -o pipefail
          bun "$SKILL/scripts/verify-all.ts" "${args[@]}" --verdicts verdicts 2>&1 | tee formal-report.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```'; tail -n 80 formal-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: formal-report-${{ inputs.only || 'all' }}
          path: |
            formal-report.txt
            formal/reports/
            formal/**/evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.stamp
        with:
          name: formal-stamp-${{ inputs.only || 'all' }}
          path: formal/manifest.json
          retention-days: 1

  # Verification runs side by side (one group per ref and model); publication is one at a time per ref. The
  # stamp is written onto the branch's head as it is now, and only for a model whose covered code is the same there
  # as at the verified commit; a lost push race re-reads the head and checks again, it never rebases the old commit.
  publish:
    if: inputs.stamp && inputs.inspect_unit == ''
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: formal-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: formal-stamp-${{ inputs.only || 'all' }}
          path: verified
      - name: Publish the stamp
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha7=${VERIFIED_SHA:0:7}
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            refused=0
            bun scripts/formal-publish.ts verified/manifest.json "$VERIFIED_SHA" --ids-out ids.txt || refused=1
            ids=$(cat ids.txt)
            if [ -z "$ids" ]; then
              [ "$refused" = 1 ] && exit 1
              echo "Nothing to stamp."
              exit 0
            fi
            git add formal/manifest.json
            git commit -q -m "chore(formal): stamp ${ids} on ${sha7}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              [ "$refused" = 1 ] && exit 1
              exit 0
            fi
            echo "push lost a race (attempt $attempt): re-reading the head"
          done
          echo "::error::could not publish the stamp after 5 attempts"
          exit 1

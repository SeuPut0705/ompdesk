# Formal verification (TLA+/TLC through verify-all.ts) on a hosted runner, on demand. A model check, its
# mutation runs and its stamp take minutes to hours of CPU, so they never run on a developer's machine:
#   gh workflow run formal.yml --ref <branch> -f only=<model id> [-f stamp=true]
#   gh run watch <run-id> --interval 120
# With `stamp`, the updated formal/manifest.json is committed back to the dispatched branch as
# `chore(formal): stamp <ids> on <sha7>`. A stamp never lands on main directly: dispatch on a branch.
name: formal
run-name: ${{ format('formal {0} {1}{2}', inputs.only || 'all', inputs.tier, inputs.stamp && ' stamp' || '') }}

on:
  workflow_dispatch:
    inputs:
      only:
        description: "One model id from formal/manifest.json (empty: every model of the tier)"
        type: string
        default: ""
      tier:
        description: "fast (the models marked fast) or deep (every model)"
        type: choice
        options: [fast, deep]
        default: fast
      stamp:
        description: "Stamp the models that passed and commit formal/manifest.json to this branch (never main)"
        type: boolean
        default: false
      skip_mutations:
        description: "Skip the mutation runs"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: formal-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Refuse a stamp on main
        if: inputs.stamp && github.ref == 'refs/heads/main'
        run: |
          echo "::error::A stamp lands through a branch: dispatch formal.yml on a branch, not main."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: TLC tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ompdesk/formal
          key: formal-tools-${{ runner.os }}-${{ hashFiles('resources/omp-builtin/formal/skills/ompdesk-formal-verify/assets/toolchain.json') }}
      - name: Verify
        env:
          ONLY: ${{ inputs.only }}
          TIER: ${{ inputs.tier }}
          STAMP: ${{ inputs.stamp }}
          SKIP_MUTATIONS: ${{ inputs.skip_mutations }}
        run: |
          args=(formal --tier "$TIER")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$STAMP" = "true" ] && args+=(--stamp)
          [ "$SKIP_MUTATIONS" = "true" ] && args+=(--skip-mutations)
          set -o pipefail
          bun resources/omp-builtin/formal/skills/ompdesk-formal-verify/scripts/verify-all.ts "${args[@]}" 2>&1 | tee formal-report.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```'; tail -n 80 formal-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: formal-report
          path: |
            formal-report.txt
            formal/reports/
            formal/**/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit the stamp
        if: inputs.stamp
        run: |
          if git diff --quiet -- formal/manifest.json; then
            echo "Nothing to stamp: formal/manifest.json is unchanged."
            exit 0
          fi
          sha7=$(git rev-parse --short=7 HEAD)
          ids=$(bun -e '
            const { execFileSync } = require("node:child_process");
            const old = JSON.parse(execFileSync("git", ["show", "HEAD:formal/manifest.json"], { encoding: "utf8" }));
            const now = JSON.parse(require("node:fs").readFileSync("formal/manifest.json", "utf8"));
            const before = new Map(old.models.map(m => [m.id, JSON.stringify([m.syncCommit, m.syncDiff])]));
            console.log(now.models.filter(m => before.get(m.id) !== JSON.stringify([m.syncCommit, m.syncDiff])).map(m => m.id).join(","));
          ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formal/manifest.json
          git commit -m "chore(formal): stamp ${ids} on ${sha7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

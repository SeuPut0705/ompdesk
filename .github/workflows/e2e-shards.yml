# The full Playwright suite on GitHub's macOS runners, split over a matrix of
# shards and run against the `out/` bundle another job of the same run uploaded.
# Called by e2e-nightly.yml and by ci.yml's manual `e2e=true`, each after its
# own `build-out` job; release.yml no longer calls it. It never runs on its own.
#
# The callers hold the account-wide macOS lane for the whole call (a concurrency group on the calling job: `mac-dispatch`
# for a dispatch, `mac-nightly` for the nightly); this workflow sets no group of its own.
#
# Sharding is scripts/e2e-shard.ts (whole spec files, dealt by recorded cost),
# not `playwright test --shard`, which counts tests that skip inside their body
# and so leaves one shard nearly empty. Every shard runs against the real latest
# omp (real-core and deep-audit) and the fake omp (everything else); playwright
# runs one worker per shard (3-core runner; playwright.config.ts).
#
# The cost is each spec file's time in the runs before: every shard writes what its files took, `timings` folds a whole
# suite's shards into the record and saves it, and `record` hands the newest one to every shard of the next run, so
# all five deal the same split (scripts/test-timings.ts). Nightly 43206894009 ran 1403 s of tests in its longest shard
# of a mean 1291 s, dealt from costs three days old; dealt from the nightly before it the longest would have been 1340 s.
#
# At most 5 macOS jobs run at once on a public repo's free tier, so the suite runs in five shards: with six the sixth
# queued behind the first to finish and the run took two rounds (nightly 42609763294: shard 6 started 994 s in, the
# run ended after 38 min of which the shards themselves were 933 to 1158 s). The suite sums ~6450 s of test time on
# the runner (nightly 43206894009), ~1290 s a shard, and no count under the cap is faster, so
# Playwright's `--global-timeout` is 35 minutes under the job's 40: at 25 under 30, five shards of ~1350 s stopped
# with tests not run (9 in 41916393486; 36 in 41817431850, with four shards). `fail-fast: false`: one run reports
# every failing shard, and `gh run rerun <id> --failed` reruns only those.
#
# One worker per shard: with two (run 42693732758) the shards summed 3856 s instead of 6376 s, but four tests that
# pass with one failed, `preview-stream`'s frame pacing every time (3.9 frames a second where it asserts 5).
#
# `specs` (space-separated e2e/*.e2e.ts paths) runs those files alone in one shard instead of the whole suite: the
# check after a fix, at the cost of the files plus ~1 min of setup, not ~25 min (e2e-nightly.yml's dispatch input).
name: e2e-shards

on:
  workflow_call:
    inputs:
      out-artifact:
        description: "Name of this run's artifact that holds the built out/ bundle"
        type: string
        default: out
      specs:
        description: "Space-separated e2e spec files to run alone in one shard; empty runs the whole suite"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The newest record of what each spec file costs (this branch's, else main's), read once for the whole run: five
  # shards restoring it themselves could each find a different one and deal different splits.
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.cache.outputs.cache-matched-key != '' }}
    steps:
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
      - if: steps.cache.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-record
          path: .ci/e2e-timings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: record
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.specs != '' && '[1]' || '[1, 2, 3, 4, 5]') }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
      SPECS_INPUT: ${{ inputs.specs }}
      # Without a record the shards are dealt from the repository's snapshot (scripts/e2e-shard-costs.json).
      OMPDESK_E2E_TIMINGS: ${{ needs.record.outputs.found == 'true' && '.ci/e2e-timings.json' || '' }}
      OMPDESK_E2E_TIMINGS_OUT: .ci/out/shard-${{ matrix.shard }}.json
      OMPDESK_TEST_REPORT: test-report/playwright.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
      # The runner is ephemeral: real-core and deep-audit run the real omp.
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      # mobile-*.e2e.ts drive the web build in Playwright's own browsers, which a fresh runner lacks.
      - name: Playwright browsers
        run: bunx playwright install chromium webkit
      # The bundle is the same bytes whichever OS built it.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.out-artifact }}
          path: out
      - if: needs.record.outputs.found == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: e2e-record
          path: .ci
      - name: Playwright, this shard's spec files
        run: |
          set -euo pipefail
          if [ -n "$SPECS_INPUT" ]; then
            read -r -a SPECS <<< "$SPECS_INPUT"
            # Only existing spec files: a typo must fail here, not match nothing or (as a Playwright regex) more.
            for spec in "${SPECS[@]}"; do
              [[ "$spec" =~ ^e2e/[A-Za-z0-9._/-]+\.e2e\.ts$ && -f "$spec" ]] || { echo "::error::not an e2e spec file: $spec"; exit 1; }
            done
          else
            # A failed listing must stop here: an empty list would run every spec.
            FILES=$(bun scripts/e2e-shard.ts "$SHARD/$SHARDS")
            read -r -a SPECS <<< "$FILES"
          fi
          test "${#SPECS[@]}" -gt 0
          # Playwright stops itself 5 minutes before the job's limit, so a shard that runs long still prints every
          # failure and leaves its traces (nightly 39749113072: shard 2 hit 30 minutes and its one failure left nothing).
          bunx playwright test --global-timeout=2100000 "${SPECS[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timings-shard-${{ matrix.shard }}
          path: .ci/out/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # Each test's result, for check control (its reader finds the job by this id; only report files go in it).
      - name: Upload the test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ job.check_run_id }}
          path: test-report/
          if-no-files-found: ignore
          retention-days: 3
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-macos-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  # Keeps the record: a whole suite's shards folded into the record the run started from, saved for the next run and
  # uploaded as `e2e-timings`. A shard that failed still leaves the spec files that passed; a run of named specs
  # measures too little to keep.
  timings:
    needs: [record, e2e]
    if: ${{ !cancelled() && inputs.specs == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: needs.record.outputs.found == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: e2e-record
          path: .ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: e2e-timings-shard-*
          path: .ci/jobs
          merge-multiple: true
      - run: mkdir -p .ci/jobs && bun scripts/test-timings.ts merge .ci/e2e-timings.json .ci/jobs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timings
          path: .ci/e2e-timings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/e2e-timings.json
          key: e2e-timings-${{ github.run_id }}-${{ github.run_attempt }}

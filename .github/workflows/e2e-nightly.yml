# The full Playwright suite, informational: nightly on main and on demand. It is
# no longer part of a release (release.yml runs @smoke on mac and win and
# real-core on mac); a failing shard here is a bug to fix, never a release block.
# The shards need the app bundle, built once on Linux (byte-identical on every OS).
#
# After a fix, check only the failing files (one shard, ~1 min of setup plus their own time, instead of ~25 min):
#   gh workflow run e2e-nightly.yml --ref main -f specs="e2e/a.e2e.ts e2e/b.e2e.ts"
# A targeted run has its own concurrency group, so it never cancels a full run (and a full run never cancels it).
#
# The parity sheet of a UI change, on a runner (a machine that must not run it, or one without a second app to pair):
#   gh workflow run e2e-nightly.yml --ref <branch> -f parity="settings-device-switch"
#   gh run download <run-id> -n parity   # <dir>/<surface>/{local,remote,phone,sheet}.png and parity.json
#   gh workflow run e2e-nightly.yml --ref <branch> -f parity="--both-orders"   # the order check: <dir>/forward and <dir>/reverse
#
# Every job here is macOS. A dispatch (not the nightly) needs the queue gate's admission, which only main and the
# branches in the repository variable MAC_REFS get, and runs in the account-wide `mac-dispatch` lane (one holder, one
# waiting request; a newer request replaces the waiting one); the nightly has a lane of its own. A dispatch whose commit
# already has a green run with the same inputs cancels itself (queue-gate.yml) unless it passes `-f force=true`.
# See .omp/rules/e2e-ci-windows.md › CI › The check queue.
name: e2e-nightly
run-name: ${{ github.event_name == 'schedule' && 'e2e-nightly' || inputs.parity && format('parity [{0}] {1}', inputs.parity, inputs.fake-env) || inputs.specs && format('e2e [{0}]', inputs.specs) || 'e2e-nightly [full]' }}

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description: "Space-separated e2e spec files to run alone (empty: the whole suite)"
        type: string
        default: ""
      parity:
        description: "Parity surfaces to capture instead of the suite (ids, space or comma separated, or --both-orders for the order check; sheets uploaded as `parity`)"
        type: string
        default: ""
      fake-env:
        description: "Space-separated OMP_GUI_*=value variables the parity capture starts the fake omp with (e.g. OMP_GUI_TEST_USAGE_ACCOUNTS=many)"
        type: string
        default: ""
      force:
        description: "Run even when this commit already has a green run with these inputs (otherwise the run cancels itself)"
        type: boolean
        default: false
      ticket:
        description: "The admission ticket OMPdesk's checks hub minted for this dispatch (queue-gate.yml); not in the run name"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}-${{ inputs.parity && 'parity' || inputs.specs && 'specs' || 'full' }}
  cancel-in-progress: true

jobs:
  # The queue's admission point (queue-gate.yml): skipped on the nightly, which has nothing to admit.
  gate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write # cancels this run when its commit is already green
    uses: ./.github/workflows/queue-gate.yml
    with:
      workflow: e2e-nightly.yml
      mac: true
      mac-refs: ${{ vars.MAC_REFS }}
      force: ${{ inputs.force }}
      ticket: ${{ inputs.ticket }}
      admission-devices: ${{ vars.CHECKS_ADMISSION_DEVICES }}
    # The gate reads one computer's admission key by name (queue-gate.yml); nothing else of the secrets.
    secrets: inherit

  build-out:
    needs: gate
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.gate.outputs.mac_ok == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out
          path: out/
          if-no-files-found: error
          retention-days: 1

  e2e:
    if: ${{ inputs.parity == '' }}
    needs: build-out
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'mac-nightly' || 'mac-dispatch' }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: read
    uses: ./.github/workflows/e2e-shards.yml
    secrets: inherit
    with:
      specs: ${{ inputs.specs || '' }}

  # The parity sheet (e2e/parity.e2e.ts, what `bun run parity` runs after its own build) of the named surfaces on a
  # macOS runner, against the bundle build-out made. Uploaded whether it passed or not: the e2e shards keep their
  # captures of a failed run only.
  parity:
    if: ${{ inputs.parity != '' }}
    needs: build-out
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'mac-nightly' || 'mac-dispatch' }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: read
    env:
      SURFACES: ${{ inputs.parity }}
      FAKE_ENV: ${{ inputs.fake-env }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Find rerun admission
        id: rerun-admission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DEVICES: ${{ vars.CHECKS_ADMISSION_DEVICES }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/check-rerun-admission.sh fetch
      - name: Verify rerun admission
        env:
          NEEDED: ${{ steps.rerun-admission.outputs.needed }}
          RECEIPT: ${{ steps.rerun-admission.outputs.receipt }}
          ADMISSION_KEY: ${{ secrets[format('CHECKS_ADMISSION_KEY_{0}', steps.rerun-admission.outputs.device)] }}
          DEVICES: ${{ vars.CHECKS_ADMISSION_DEVICES }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/check-rerun-admission.sh verify
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
      # The fake omp's terminals and search run stock's natives from the installed omp (e2e/remote-harness.ts).
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      # The phone's page runs in Playwright's own Chromium, which a fresh runner lacks.
      - name: Playwright browsers
        run: bunx playwright install chromium webkit
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: out
          path: out
      - name: Capture
        run: |
          set -euo pipefail
          if [ "$SURFACES" = "--both-orders" ]; then
            # The order check (scripts/parity.ts --both-orders): every surface forward and reversed, into
            # parity-out/forward and parity-out/reverse.
            OMP_GUI_PARITY="$PWD/parity-out" OMP_GUI_PARITY_ORDERS=both \
              bunx playwright test e2e/parity.e2e.ts --trace off --reporter line --output parity-out/results
            exit 0
          fi
          read -r -a IDS <<< "${SURFACES//,/ }"
          test "${#IDS[@]}" -gt 0
          for id in "${IDS[@]}"; do
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "::error::not a surface id: $id"; exit 1; }
          done
          ONLY=$(IFS=,; echo "${IDS[*]}")
          for pair in $FAKE_ENV; do
            [[ "$pair" =~ ^OMP_GUI_[A-Z0-9_]+=[A-Za-z0-9_.,-]*$ ]] || { echo "::error::not an OMP_GUI_ variable: $pair"; exit 1; }
            export "$pair"
          done
          OMP_GUI_PARITY="$PWD/parity-out" OMP_GUI_PARITY_ONLY="$ONLY" \
            bunx playwright test e2e/parity.e2e.ts --trace off --reporter line --output parity-out/results
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity
          path: parity-out/
          if-no-files-found: ignore
          retention-days: 7

# Pushing a `package.json` version bump to main releases it: when tag
# `v<version>` does not exist yet and CHANGELOG.md has a dated
# `## [<version>] - YYYY-MM-DD` section, this runs the checks, packages macOS
# (arm64) and Windows (x64), launches each fresh build, and only when all of
# that passed creates the tag and the GitHub Release: the changelog section as
# notes, and exactly two assets, `ompdesk-mac-arm64.dmg` and
# `ompdesk-windows-setup.exe`. The in-app updater reads their version, size and
# SHA-512 from an HTML comment the publish job appends to the notes
# (`<!-- ompdesk-update {json} -->`, parsed by src/main/update-release.ts).
# An `Unreleased` heading or an existing tag makes the run a no-op.
# `workflow_dispatch` re-runs it; `dry_run` does everything except the tag and
# release (the packages stay as run artifacts) and works on any branch.
#
# Cost: a private repo bills macOS minutes at 10x Linux and Windows at 2x, and
# every job rounds up to a whole minute. So each OS gets one job that installs
# once and reuses the build packaging produced (`out/`) for its e2e, the
# OS-independent checks run on Linux, and macOS runs only @smoke plus the
# real-omp suite (the full suite runs locally before every release; manual on
# CI: `gh workflow run ci.yml -f e2e=true`). After a flaky failure, rerun only
# the failed job: `gh run rerun <id> --failed`.
#
# The mac job runs on the maintainer's own Mac (self-hosted runner, label
# `ompdesk-mac`, free of Actions minutes) for runs on main only; other refs,
# and `hosted_mac` when that Mac is off, use GitHub's macOS runner. That runner
# acts as the maintainer's login account, so the job must not change its
# environment: it keeps the installed bun (no setup-bun, which writes
# ~/.bun/bin) and omp (real-core runs against it), and every action is pinned
# to a commit.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not create the tag or release"
        type: boolean
        default: false
      hosted_mac:
        description: "Package macOS on GitHub's runner (when the maintainer's Mac is off; about 20 billed minutes)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # mac signs ad-hoc (`identity: "-"` in electron-builder.yml); never look for
  # a keychain certificate or publish from electron-builder itself.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Transition switch. Installed apps up to v0.17.x update from
  # electron-updater's `latest-mac.yml` / `latest.yml` and fetch the files those
  # name by exact name: `ompdesk-<v>-arm64-mac.zip` (relaunch mode),
  # `ompdesk-<v>-arm64.dmg` (manual mode), `ompdesk-<v>-setup.exe` (Windows).
  # "true" adds that feed and those files to the release, so such installs
  # update once into the new updater. Set it to "false" once v0.18.0 is out;
  # releases then carry exactly the two assets.
  LEGACY_UPDATE_FEED: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: meta
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          V=$(jq -r .version package.json)
          TAG="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::notice::$TAG already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$TAG already exists (dry run continues)."
          fi

          HEADING=$(awk -v h="## [$V]" 'index($0, h) == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error file=CHANGELOG.md::No '## [$V]' section in CHANGELOG.md; write it before releasing $TAG."
            exit 1
          fi
          if [[ "$HEADING" == *Unreleased* && "$DRY_RUN" != "true" ]]; then
            echo "::notice::CHANGELOG.md still marks $V as Unreleased; date the heading to release $TAG."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only (got $GITHUB_REF); use dry_run on other branches."
            exit 1
          fi

          mkdir -p notes
          awk -v h="## [$V]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error file=CHANGELOG.md::The '## [$V]' section in CHANGELOG.md is empty."
            exit 1
          fi
          MIN_OMP=$(sed -n 's/^export const MIN_OMP_VERSION = "\(.*\)";$/\1/p' src/main/omp-runtime.ts)
          if [ -z "$MIN_OMP" ]; then
            echo "::error file=src/main/omp-runtime.ts::MIN_OMP_VERSION not found."
            exit 1
          fi
          # shellcheck disable=SC2016 # literal backticks are Markdown
          printf '\n---\n\nRequires omp **%s** or newer (`omp update`).\n' "$MIN_OMP" >> notes/notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          retention-days: 1

  # OS-independent checks: typecheck, biome, surface policy, vitest.
  check:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bunx biome check src e2e
      - run: node scripts/lint-surfaces.mjs
      - run: bunx vitest run

  # Package, verify the bundle, then launch the build packaging just made:
  # @smoke on the fake omp, and real-core against omp (the latest published
  # one on GitHub's runner, the maintainer's installed one on their Mac).
  mac:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ (github.ref == 'refs/heads/main' && inputs.hosted_mac != true) && fromJSON('["self-hosted", "macOS", "ARM64", "ompdesk-mac"]') || 'macos-latest' }}
    timeout-minutes: 20
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # bun runs lifecycle scripts with the `node` on PATH; on Node 26 (the
      # maintainer's Mac) electron's extract-zip exits mid-unzip without an
      # error, leaving no binary. Under bun it unzips; a no-op once installed.
      - name: Ensure the Electron binary
        run: bun node_modules/electron/install.js && test -f node_modules/electron/path.txt
      # The legacy feed also needs the ZIP (and the latest-mac.yml listing it).
      - name: Package
        run: |
          set -euo pipefail
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            bun run build
            bunx electron-builder --mac dmg zip --arm64 --publish never
          else
            bun run package:mac -- --publish never
          fi
      - name: Verify bundle
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/ompdesk-$V-arm64.dmg"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/OMPdesk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$APP/Contents/Resources/gui-bridge/index.ts"
          lipo -archs "$APP/Contents/MacOS/OMPdesk" | grep -qx arm64
      - name: Install omp
        if: runner.environment == 'github-hosted'
        run: |
          bun install -g @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bunx playwright test --grep "@smoke"
      - run: bunx playwright test e2e/real-core.e2e.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-macos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-arm64.dmg" release/ompdesk-mac-arm64.dmg
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest-mac.yml release/
            sed -n 's/^ *- url: //p' dist/latest-mac.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-arm64-mac.zip"
          fi
          ls -l release
      # The GitHub Release keeps these files; the run artifact only carries
      # them to `publish` (a dry run keeps them a week to download).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-mac
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}

  # vitest on Windows (paths, PATH lookup, cmd.exe shim, named pipes), package,
  # then @smoke on the fake omp against the build packaging just made.
  win:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      - run: bun run package:win -- --publish never
      - name: Verify package
        shell: bash
        run: test -f dist/win-unpacked/resources/gui-bridge/index.ts
      - run: bunx playwright test --grep "@smoke"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-setup.exe" release/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest.yml release/
            sed -n 's/^ *- url: //p' dist/latest.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-setup.exe"
          fi
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-win
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}

  # Runs only when the checks and both platform jobs succeeded.
  publish:
    needs: [prepare, check, mac, win]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ompdesk-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: notes
      - name: Check assets
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/ompdesk-mac-arm64.dmg
          test -f dist/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" != "true" ]; then
            ASSETS=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ')
            if [ "$ASSETS" != "ompdesk-mac-arm64.dmg ompdesk-windows-setup.exe" ]; then
              echo "::error::A release carries exactly two assets; got: $ASSETS"
              exit 1
            fi
          fi
      # Version, size and SHA-512 (base64, as electron-updater writes it) of the
      # two installers, for the in-app updater (src/main/update-release.ts). An
      # HTML comment: GitHub does not render it.
      - name: Append update metadata
        run: |
          set -euo pipefail
          entry() {
            jq -n --arg name "$1" \
              --argjson size "$(wc -c < "dist/$1" | tr -d ' ')" \
              --arg sha512 "$(openssl dgst -sha512 -binary "dist/$1" | base64 | tr -d '\n')" \
              '{name: $name, size: $size, sha512: $sha512}'
          }
          META=$(jq -cn --arg version "$VERSION" --arg releaseDate "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson mac "$(entry ompdesk-mac-arm64.dmg)" \
            --argjson windows "$(entry ompdesk-windows-setup.exe)" \
            '{version: $version, releaseDate: $releaseDate, files: {mac: $mac, windows: $windows}}')
          printf '\n<!-- ompdesk-update %s -->\n' "$META" >> notes/notes.md
          cat notes/notes.md
      - name: Create tag and release
        if: inputs.dry_run != true
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes/notes.md dist/*

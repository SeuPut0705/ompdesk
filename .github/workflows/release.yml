# Pushing a `package.json` version bump to main releases it: when tag
# `v<version>` does not exist yet and CHANGELOG.md has a dated
# `## [<version>] - YYYY-MM-DD` section, this runs the checks, packages macOS
# (arm64) and Windows (x64), launches each fresh build, and only when all of
# that passed creates the tag and the GitHub Release: the changelog section as
# notes, and exactly two assets, `ompdesk-mac-arm64.dmg` and
# `ompdesk-windows-setup.exe`. The in-app updater reads their version, size and
# SHA-512 from an HTML comment the publish job appends to the notes
# (`<!-- ompdesk-update {json} -->`, parsed by src/main/update-release.ts).
# An `Unreleased` heading or an existing tag makes the run a no-op.
# `workflow_dispatch` re-runs it; `dry_run` does everything except the tag and
# release (the packages stay as run artifacts) and works on any branch.
#
# Layout: the repo is public, so hosted runners are free and every job runs on
# one (Linux, macOS arm64, Windows). This is the whole release gate (what
# `bun run gate` runs locally): `build` builds the app bundle (`out/`) once and
# runs types, biome and the surface policy; `check` runs the full vitest
# suite; `e2e` runs the FULL Playwright suite on macOS, split into shards
# (e2e-shards.yml) against that out/; `mac` and `win` package and launch their
# own build (@smoke, plus the real-omp suite on macOS); `publish` runs only
# when everything but the shards passed (the shards report, they do not block). Windows packages the
# shared out/ and runs the OS-independent tests beside it, in one job
# (platform tests while it waits for out/, then package, then @smoke).
# Four shards plus `mac` are the five macOS jobs a public repo may run at
# once, so they all start together. After a flaky failure, rerun only the
# failed jobs, shards included: `gh run rerun <id> --failed`.
#
# Trust: this workflow starts only from a push to main that touches
# package.json or from a manual dispatch (write access), never from a pull
# request. Every job has a read-only token except `publish` (contents: write),
# and the signing secrets are read by the `mac` Package step alone. Every
# action is pinned to a commit.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not create the tag or release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # mac signing is scripts/mac-sign.cjs with OMPdesk's pinned self-signed
  # certificate (repository secrets below); never look for a keychain
  # certificate or publish from electron-builder itself.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Transition switch. Installed apps up to v0.17.x update from
  # electron-updater's `latest-mac.yml` / `latest.yml` and fetch the files those
  # name by exact name: `ompdesk-<v>-arm64-mac.zip` (relaunch mode),
  # `ompdesk-<v>-arm64.dmg` (manual mode), `ompdesk-<v>-setup.exe` (Windows).
  # "true" adds that feed and those files to the release, so such installs
  # update once into the new updater. v0.18.0 shipped it on; it is off since
  # v0.18.1, so releases carry exactly the two assets.
  LEGACY_UPDATE_FEED: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: meta
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          V=$(jq -r .version package.json)
          TAG="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::notice::$TAG already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$TAG already exists (dry run continues)."
          fi

          HEADING=$(awk -v h="## [$V]" 'index($0, h) == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error file=CHANGELOG.md::No '## [$V]' section in CHANGELOG.md; write it before releasing $TAG."
            exit 1
          fi
          if [[ "$HEADING" == *Unreleased* && "$DRY_RUN" != "true" ]]; then
            echo "::notice::CHANGELOG.md still marks $V as Unreleased; date the heading to release $TAG."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only (got $GITHUB_REF); use dry_run on other branches."
            exit 1
          fi

          mkdir -p notes
          # Korean first, then the English summary after a rule: the `<!-- en -->` marker line becomes `---`.
          awk -v h="## [$V]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f && $0 == "<!-- en -->" { print "---"; next } f' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error file=CHANGELOG.md::The '## [$V]' section in CHANGELOG.md is empty."
            exit 1
          fi
          MIN_OMP=$(sed -n 's/^export const MIN_OMP_VERSION = "\(.*\)";$/\1/p' src/main/omp-runtime.ts)
          if [ -z "$MIN_OMP" ]; then
            echo "::error file=src/main/omp-runtime.ts::MIN_OMP_VERSION not found."
            exit 1
          fi
          # shellcheck disable=SC2016 # literal backticks are Markdown
          printf '\n---\n\nRequires omp **%s** or newer (`omp update`).\n' "$MIN_OMP" >> notes/notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          retention-days: 1

  # The app bundle (`out/`) is the same bytes whichever OS builds it (out/
  # built on Linux, macOS and Windows diffed identical), so it is built once,
  # early, and `win` packages that instead of building its own (about 40 s of
  # its critical path). The OS-independent checks follow the upload, off every
  # critical path.
  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # Nothing here launches Electron, and `win` waits on this job's upload.
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out
          path: out/
          if-no-files-found: error
          retention-days: 1
          # A rerun after a failed check below uploads it again.
          overwrite: true
      - run: bun run check:types
      - run: bunx biome check src e2e resources scripts
      - run: node scripts/lint-surfaces.mjs

  # vitest on its own runner: the longest OS-independent check, in one run
  # (two shards in two jobs each paid setup and install and gained nothing).
  check:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Tests import electron, whose index.js throws without the binary; see
      # `mac` for why a plain install may leave none on the Mac. A no-op once
      # installed.
      - name: Ensure the Electron binary
        run: bun node_modules/electron/install.js && test -f node_modules/electron/path.txt
      - run: bunx vitest run

  # The full Playwright suite (the e2e half of `bun run gate`), four macOS
  # shards at once (e2e-shards.yml) against build's out/. The permissions here
  # cap the called workflow's, and `publish` waits for every shard.
  e2e:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-shards.yml

  # Package, verify the bundle, then launch the build packaging just made:
  # @smoke on the fake omp, and real-core against the latest published omp.
  mac:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # bun runs lifecycle scripts with the `node` on PATH; where electron's
      # extract-zip exits mid-unzip without an error no binary is left. Under
      # bun it unzips; a no-op once installed.
      - name: Ensure the Electron binary
        run: bun node_modules/electron/install.js && test -f node_modules/electron/path.txt
      # The legacy feed also needs the ZIP (and the latest-mac.yml listing it).
      # A release must be signed with the pinned certificate: an ad-hoc
      # fallback would make macOS ask every user for its privacy permissions
      # again. Only a run on main gets the secrets and requires them; a dry run
      # from another branch (anyone with write access can start one and pick
      # the branch's code) packages ad-hoc, with no secret in reach, and only
      # proves the package builds and launches.
      - name: Package
        env:
          OMPDESK_MAC_SIGNING_P12_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.MAC_SIGNING_P12_BASE64 || '' }}
          OMPDESK_MAC_SIGNING_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_SIGNING_PASSWORD || '' }}
          OMPDESK_MAC_SIGNING_REQUIRED: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            bun run build
            bunx electron-builder --mac dmg zip --arm64 --publish never
          else
            bun run package:mac -- --publish never
          fi
      - name: Verify bundle
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "dist/ompdesk-$V-arm64.dmg"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/OMPdesk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            SHA1=$(jq -r .certificateSha1 scripts/mac-signing.json)
            REQ=$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^designated => //p')
            if [ "$REQ" != "identifier \"com.seuput.ompdesk\" and certificate root = H\"$SHA1\"" ]; then
              echo "::error::OMPdesk.app is not signed with the pinned certificate: $REQ"
              exit 1
            fi
          else
            echo "::notice::$GITHUB_REF is not main: ad-hoc signed, pinned certificate not checked."
          fi
          test -f "$APP/Contents/Resources/gui-bridge/index.ts"
          lipo -archs "$APP/Contents/MacOS/OMPdesk" | grep -qx arm64
      - name: Install omp
        run: |
          bun install -g @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bunx playwright test --grep "@smoke"
      - run: bunx playwright test e2e/real-core.e2e.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-macos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-arm64.dmg" release/ompdesk-mac-arm64.dmg
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest-mac.yml release/
            sed -n 's/^ *- url: //p' dist/latest-mac.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-arm64-mac.zip"
          fi
          ls -l release
      # The GitHub Release keeps these files; the run artifact only carries
      # them to `publish` (a dry run keeps them a week to download).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-mac
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}

  # One Windows job, one checkout and install. `bun run test:platform` is
  # vitest on every test outside src/renderer (paths, PATH lookup, cmd.exe
  # shims, spawn, named pipes, file modes); the renderer never sees the host
  # OS and its tests run in `check` (src/main/platform-test-scope.test.ts
  # keeps host-platform checks out of them). It runs in the background of the
  # step that waits for `build`'s out/, where this runner would otherwise idle
  # (competing with electron-builder it took 132 s with one test worker, and
  # with two, tests that wait on git missed their 1 s poll window; alone it
  # took 62-66 s with the default workers). Then package, then the @smoke e2e
  # on the fake omp against that package: setup takeover, split select,
  # auto-resume after a kill and a quit, Model roles, the Changes commit, the
  # Files edit, Preview, Mica and close-to-tray, a new window's theme,
  # steering a running turn from the composer.
  win:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # list this run's artifacts while `build` still runs
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # bun's cache on the workspace volume (D:) instead of the profile on C:,
      # so install never crosses volumes: 60-86 s became 28-41 s. Restoring it
      # with actions/cache measured no faster (17 s restore + 18 s install) and
      # its upload costs 42 s after every lockfile change, so it starts empty.
      # (On Linux a cold install takes 5-10 s; a restored cache saved nothing.)
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      # (`ELECTRON_SKIP_BINARY_DOWNLOAD` fails here: gpu-fallback and sidecar
      # tests import electron, whose index.js throws without the binary.)
      - run: bun install --frozen-lockfile
      # `build` uploads out/ about when this install ends; `needs: build`
      # would instead start this job only once build's checks are done too.
      # The platform tests run meanwhile and are joined after the download.
      - name: Platform tests, while waiting for out/ from the build job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run test:platform > platform-test.log 2>&1 &
          tests=$!
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          until [ "$(gh api "$run/artifacts?name=out" --jq .total_count)" -gt 0 ]; do
            if [ "$(gh api "$run/jobs?filter=latest" --jq '.jobs[] | select(.name == "build") | .status')" = completed ]; then
              kill "$tests" 2>/dev/null || true
              echo "::error::The build job ended without uploading out/."
              exit 1
            fi
            sleep 3
          done
          gh run download "$GITHUB_RUN_ID" --name out --dir out
          status=0
          wait "$tests" || status=$?
          cat platform-test.log
          if [ "$status" -ne 0 ]; then
            echo "::error::test:platform failed (exit $status)."
            exit 1
          fi
      # The NSIS payload is a 7z that electron-builder packs at -mx=9 whatever
      # `compression:` says (`normal` and `maximum` are both 9); that single
      # LZMA2 pass took 61 s of this job on 2 cores. Level 4 takes about 27 s
      # for a setup about a quarter larger (the 7z of v0.32.1's app: 80 MB at
      # 9, 100 MB at 4; level 5-7 cost as much time as 9).
      - name: Package
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "4"
        run: bunx electron-builder --config electron-builder.win.yml --win --x64 --publish never
      - name: Verify package
        shell: bash
        run: test -f dist/win-unpacked/resources/gui-bridge/index.ts
      - run: bunx playwright test --grep "@smoke"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp "dist/ompdesk-$V-setup.exe" release/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" = "true" ]; then
            cp dist/latest.yml release/
            sed -n 's/^ *- url: //p' dist/latest.yml | while IFS= read -r name; do cp "dist/$name" release/; done
            test -f "release/ompdesk-$V-setup.exe"
          fi
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompdesk-win
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.dry_run == true && 7 || 1 }}

  # Runs when prepare, build, check, mac (@smoke + real-core) and win (@smoke)
  # succeeded (the job `if` keeps GitHub's implicit success(), so a failed or
  # skipped need stops it). The sharded full e2e is deliberately NOT a need: on
  # hosted runners it is informational until it is stable (AGENTS.md, CI);
  # its results stay visible on the run. Local `bun run gate` is the full-suite proof.
  publish:
    needs: [prepare, build, check, mac, win]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ompdesk-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: notes
      - name: Check assets
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/ompdesk-mac-arm64.dmg
          test -f dist/ompdesk-windows-setup.exe
          if [ "$LEGACY_UPDATE_FEED" != "true" ]; then
            ASSETS=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ')
            if [ "$ASSETS" != "ompdesk-mac-arm64.dmg ompdesk-windows-setup.exe" ]; then
              echo "::error::A release carries exactly two assets; got: $ASSETS"
              exit 1
            fi
          fi
      # Version, size and SHA-512 (base64, as electron-updater writes it) of the
      # two installers, for the in-app updater (src/main/update-release.ts). An
      # HTML comment: GitHub does not render it.
      - name: Append update metadata
        run: |
          set -euo pipefail
          entry() {
            jq -n --arg name "$1" \
              --argjson size "$(wc -c < "dist/$1" | tr -d ' ')" \
              --arg sha512 "$(openssl dgst -sha512 -binary "dist/$1" | base64 | tr -d '\n')" \
              '{name: $name, size: $size, sha512: $sha512}'
          }
          META=$(jq -cn --arg version "$VERSION" --arg releaseDate "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson mac "$(entry ompdesk-mac-arm64.dmg)" \
            --argjson windows "$(entry ompdesk-windows-setup.exe)" \
            '{version: $version, releaseDate: $releaseDate, files: {mac: $mac, windows: $windows}}')
          printf '\n<!-- ompdesk-update %s -->\n' "$META" >> notes/notes.md
          cat notes/notes.md
      - name: Create tag and release
        if: inputs.dry_run != true
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes/notes.md dist/*

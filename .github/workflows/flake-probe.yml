# One test file run many times on GitHub's runners, to catch a flaky test without a hand-made probe branch
# (copied cases, added delays). `bun run flake <spec> --ci [--grep <regex>] [--repeat <n>] [--os <os>]` dispatches
# it on the current pushed branch and prints the run's URL; scripts/flake.ts does the work here as it does on a
# developer's machine: Playwright `--repeat-each` for an e2e spec (after `bun run build`), `n` separate `vitest run`s
# for a vitest file (vitest 3 has no repeat flag), retries off, every repeat run to the end. Each OS's job summary
# holds its passes and failures, the failures per test and the first failure's message. See
# .omp/rules/e2e-ci-windows.md › Flaky tests.
#
# Its own workflow, not a ci.yml input: ci.yml's pre-flight jobs run on every dispatch, and its per-ref
# concurrency would cancel a probe on the next push (or one probe the next). Manual only; inputs reach the
# shell through `env`, never inline.
#
# The macOS leg is the account's scarcest runner: it needs the queue gate's admission (main or a MAC_REFS branch) and
# runs in the account-wide `mac-dispatch` lane. A probe is meant to be repeated, so no green run of the same name
# cancels a new one; an identical dispatch waits for the one running, and a third replaces the waiting one.
# See .omp/rules/e2e-ci-windows.md › CI › The check queue.
name: flake-probe
run-name: "flake ${{ inputs.spec }} ×${{ inputs.repeat }} (${{ inputs.os }})"

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Test file: an e2e spec (e2e/*.e2e.ts) or a vitest file"
        type: string
        required: true
      grep:
        description: "Only the tests whose title matches (Playwright --grep, vitest -t)"
        type: string
        default: ""
      repeat:
        description: "Times each test runs"
        type: number
        default: 10
      os:
        description: "Runners (an e2e spec runs on macOS and Windows only; all = those for an e2e spec)"
        type: choice
        options: [all, macos, windows, ubuntu]
        default: all
      ticket:
        description: "The admission ticket OMPdesk's checks hub minted for a macOS probe (queue-gate.yml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: flake-probe-${{ github.ref }}-${{ inputs.spec }}-${{ inputs.grep }}-${{ inputs.repeat }}-${{ inputs.os }}
  cancel-in-progress: false

jobs:
  # The queue's admission point (queue-gate.yml); a probe is repeated on purpose, so it never cancels as a duplicate.
  gate:
    permissions:
      contents: read
      actions: write # the gate's job may cancel a duplicate run; dedupe is off here
    uses: ./.github/workflows/queue-gate.yml
    with:
      workflow: flake-probe.yml
      mac: ${{ inputs.os == 'macos' || inputs.os == 'all' }}
      mac-refs: ${{ vars.MAC_REFS }}
      dedupe: false
      ticket: ${{ inputs.ticket }}
    secrets:
      admission-key: ${{ secrets.CHECKS_ADMISSION_KEY }}

  probe:
    name: probe (${{ matrix.os }})
    needs: gate
    if: ${{ !cancelled() && (inputs.os != 'macos' || needs.gate.outputs.mac_ok == 'true') }}
    concurrency:
      group: ${{ matrix.os == 'macos' && 'mac-dispatch' || format('flake-probe-{0}-{1}', github.run_id, matrix.os) }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('[{0}]', inputs.os != 'all' && format('"{0}"', inputs.os) || format('{0}"windows"{1}', needs.gate.outputs.mac_ok == 'true' && '"macos",' || '', !endsWith(inputs.spec, '.e2e.ts') && ',"ubuntu"' || ''))) }}
    defaults:
      run:
        shell: bash
    env:
      SPEC: ${{ inputs.spec }}
      GREP: ${{ inputs.grep }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - if: runner.os == 'Windows'
        name: Put bun's cache on the workspace volume
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      # Tests import electron and e2e launches it: the shared install fetches the binary.
      - uses: ./.github/actions/install
      # As ci.yml's check: the stock suites skip without omp, real-core launches it.
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          bun pm bin -g >> "$GITHUB_PATH"
          "$(bun pm bin -g)/omp" --version
      - name: Repeat the spec
        run: bun scripts/flake.ts "$SPEC" --repeat "$REPEAT" ${GREP:+--grep "$GREP"}
      - if: ${{ !cancelled() && endsWith(inputs.spec, '.e2e.ts') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

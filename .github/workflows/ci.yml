# Typecheck, lint, unit/component tests, build on every push and PR, on Linux
# only: the cheapest runner (macOS minutes bill at 10x Linux, Windows at 2x).
# Windows-specific paths (PATH lookup, cmd.exe shim, named pipes) are covered
# where they ship: release.yml runs the tests outside src/renderer
# (`bun run test:platform`), packaging and the @smoke e2e on Windows, and
# packaging plus @smoke and the real-omp e2e on macOS.
#
# The full Playwright suite is manual (`gh workflow run ci.yml -f e2e=true`);
# every release runs it locally first. On main it runs on the maintainer's
# own Mac (self-hosted `ompdesk-mac`, see release.yml for the rules that
# runner imposes); other refs use GitHub's macOS runner (about 60 billed
# minutes).
#
# The real Windows install of the app's automatic setup is manual too
# (`gh workflow run ci.yml -f install_check=true`): Bun's installer, the
# pinned PortableGit and `bun install -g` omp into a temp USERPROFILE.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the full Playwright e2e suite on macOS"
        type: boolean
        default: false
      install_check:
        description: "Also run the real automatic-setup install (Bun, PortableGit, omp) on Windows"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A `release: vX.Y.Z` push also starts release.yml, which runs these checks
  # before packaging, so the push run would only repeat them.
  check:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bunx biome check src e2e resources scripts
      - run: node scripts/lint-surfaces.mjs
      - run: bunx vitest run
      - run: bun run build

  # Launches the built app: the full suite, against omp (the latest published
  # one on GitHub's runner, the maintainer's installed one on their Mac; no
  # provider credentials, each suite uses an isolated agent dir).
  e2e:
    if: inputs.e2e
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "macOS", "ARM64", "ompdesk-mac"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # See release.yml's mac job: electron's unzip fails silently on Node 26.
      - name: Ensure the Electron binary
        run: bun node_modules/electron/install.js && test -f node_modules/electron/path.txt
      - name: Install omp
        if: runner.environment == 'github-hosted'
        run: |
          bun install -g @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bun run build
      - run: bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-macos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  # The app's automatic setup (src/main/setup/) for real on a fresh Windows
  # profile: scripts/setup-install-check.ts runs Bun's installer, PortableGit
  # (the runner's preinstalled Git for Windows hidden, so the managed copy is
  # what omp finds) and `bun install -g` omp through the app's runner into a
  # temp USERPROFILE/BUN_INSTALL, then asserts omp is detected at the minimum
  # version, the registry PATH refresh saw Bun, and stock omp's shell is that
  # Git Bash, not cmd.exe.
  install-check:
    if: inputs.install_check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/setup-install-check.ts --hide-system-git

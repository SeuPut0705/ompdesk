# Typecheck, lint, unit/component tests, build on every push and PR, on Linux
# only: the cheapest runner (macOS minutes bill at 10x Linux, Windows at 2x).
# Windows-specific paths (PATH lookup, cmd.exe shim, named pipes) are covered
# where they ship: release.yml runs vitest, packaging and the @smoke e2e on
# Windows, and packaging plus @smoke and the real-omp e2e on macOS.
#
# The full Playwright suite on macOS is manual (`gh workflow run ci.yml -f
# e2e=true`, about 60 billed minutes); every release runs it locally first.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the full Playwright e2e suite on macOS (about 60 billed minutes)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A `release: vX.Y.Z` push also starts release.yml, which runs these checks
  # before packaging, so the push run would only repeat them.
  check:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bunx biome check src e2e
      - run: node scripts/lint-surfaces.mjs
      - run: bunx vitest run
      - run: bun run build

  # Launches the built app: the full suite, against the latest published omp
  # (real-core, deep-audit and the stats route need it; installed here with no
  # provider credentials, each suite uses an isolated agent dir).
  e2e:
    if: inputs.e2e
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install omp
        run: |
          bun install -g @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bun run build
      - run: bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

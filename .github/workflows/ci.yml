# Pre-flight on every push to main (the blocking checks release.yml runs:
# types, biome, surface policy, vitest, the build, Windows `test:platform`,
# OMPdesk's Rust on Linux and Windows, all in parallel; the macOS checks
# (@smoke, Rust on macOS, the parity vitest, the memory build) are mac-main.yml
# beside it), so a release finds nothing red that a push did not already
# show; a pull request (and a manual run) runs the Linux jobs
# alone, `native`'s Linux leg among them. Windows packaging, the real-omp e2e
# and the NSIS/DMG packages stay in release.yml.
#
# The queue is managed by the workflow, not by whoever dispatches (.omp/rules/e2e-ci-windows.md › CI › The check
# queue): a push to main has one run going and the newest waiting (`ci-main`), a dispatch replaces its own older run, `gate`
# (queue-gate.yml) admits macOS only to main and MAC_REFS branches and cancels a commit's second identical run, and
# every dispatched macOS job of the account shares one lane (`mac-dispatch`). A push's own macOS checks are
# mac-main.yml, a queue of their own, so a long wait for a macOS runner never holds back this run's verdict.
#
# What a run runs is decided once, by `plan` (scripts/ci-plan.ts), and written to the run's summary. A branch's
# dispatch runs the unit tests its change reaches and `native` only when the change touches what it reads
# (`scope`, default `changed`); a push to main, a pull request, the landing gate (`mac=true`) and `scope=full` run
# everything; `static` and `build` always run whole. The vitest jobs are a matrix `plan` sizes from what each test
# file cost in the recorded runs, so the shards end together (scripts/test-timings.ts; `timings` keeps the record).
#
# Pull requests (including from forks) run only the Linux jobs with a read-only
# token and no secrets; no job here uses `pull_request_target`. Every other job
# is a manual dispatch.
#
# The full Playwright suite is manual here (`gh workflow run ci.yml -f e2e=true`):
# it builds out/ on Linux and runs the five macOS shards of e2e-shards.yml,
# which e2e-nightly.yml also runs every night (a release does not).
#
# The real Windows install of the app's automatic setup is manual too
# (`gh workflow run ci.yml -f install_check=true`): Bun's installer, the
# pinned PortableGit (downloaded by main with byte progress) and
# `bun install -g` omp into a temp USERPROFILE.
#
# The packaged one-click Windows setup is checked by hand as well
# (`gh workflow run ci.yml -f installer_check=true`): silently, as a double-click,
# and over an all-users install from the assisted installer.
#
# The Windows e2e is manual too (`gh workflow run ci.yml -f win_e2e=true`): the
# same @smoke specs release.yml's `win` job runs (setup takeover, split select,
# auto-resume after a kill and a quit, Model roles, the Changes commit, the
# Files edit, Preview, Mica and close-to-tray, a new window's theme, steering a running
# turn from the composer) with their captures uploaded,
# plus the omp update while an omp runs.
name: ci

# What a dispatch was asked to run, in the run's name: queue-gate.yml compares it to find the same commit already green.
# Keep it, `concurrency.group` and the `with:` of `gate` in step (src/main/packaging-config.test.ts pins them).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('ci [{0}]', format('{0}{1}{2}{3}{4}{5}{6}{7}', inputs.batch && 'batch ' || '', inputs.scope == 'full' && 'scope=full ' || '', inputs.mac && 'mac ' || '', inputs.e2e && 'e2e ' || '', inputs.install_check && 'install-check ' || '', inputs.win_platform && 'win-platform ' || '', inputs.win_e2e && format('win-e2e={0} ', inputs.win_e2e_grep) || '', inputs.installer_check && format('installer={0} ', inputs.legacy_tag) || '')) || '' }}

on:
  push:
    branches: [main]
    # Nothing a check reads: Markdown, the design docs and screenshots, the
    # license and third-party notice texts, the issue forms, the scheduled
    # checks' own workflows.
    paths-ignore: ["**.md", "docs/**", "LICENSE", "THIRD_PARTY_NOTICES.txt", ".github/ISSUE_TEMPLATE/**", ".github/workflows/setup-assets-health.yml", ".github/workflows/omp-latest.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "THIRD_PARTY_NOTICES.txt", ".github/ISSUE_TEMPLATE/**", ".github/workflows/setup-assets-health.yml", ".github/workflows/omp-latest.yml"]
  workflow_dispatch:
    inputs:
      batch:
        description: "Run the Linux and Windows jobs a push to main runs, on this ref (a branch's verdict while it is worked on)"
        type: boolean
        default: false
      scope:
        description: "changed: the unit tests this branch's change reaches, and Rust's checks only when it touches them. full: every test. A run with mac is always full"
        type: choice
        options: [changed, full]
        default: changed
      mac:
        description: "Also run the macOS jobs a push to main runs (mac-smoke, mac-native, memory, native macOS): with batch, the gate right before landing"
        type: boolean
        default: false
      e2e:
        description: "Also run the full Playwright e2e suite on macOS"
        type: boolean
        default: false
      install_check:
        description: "Also run the real automatic-setup install (Bun, PortableGit, omp) on Windows"
        type: boolean
        default: false
      win_platform:
        description: "Also run bun run test:platform on Windows (main's pushes cancel each other)"
        type: boolean
        default: false
      win_e2e:
        description: "Also run the @smoke e2e (fake omp) and the omp update lock check on Windows, with captures"
        type: boolean
        default: false
      win_e2e_grep:
        description: "Playwright --grep for the Windows e2e (default: every @smoke spec)"
        type: string
        default: "@smoke"
      installer_check:
        description: "Also package the Windows setup and install it (silent, double-click, over an all-users install)"
        type: boolean
        default: false
      legacy_tag:
        description: "Release whose assisted-installer setup the installer check installs for all users first"
        type: string
        default: v0.26.0
      force:
        description: "Run even when this commit already has a green run with these inputs (otherwise the run cancels itself)"
        type: boolean
        default: false

# Main: one run going and the newest push waiting. A push that finds a run going waits (cancel-in-progress false), and a
# newer push replaces the one waiting, so main never holds more than two runs, no run is cancelled once it started and
# a verdict arrives every run-length however fast pushes come (with one group for the branch and cancel-in-progress
# true, each push killed the run before it and no commit ever got a verdict). A release commit (its jobs are all
# skipped, release.yml checks it) cancels what runs and waits, so the runners it needs are free.
# Any other ref: the newest dispatch with the same inputs replaces the older one; other inputs run beside it.
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}-{1}', github.ref, format('{0}{1}{2}{3}{4}{5}{6}{7}', inputs.batch && 'batch ' || '', inputs.scope == 'full' && 'scope=full ' || '', inputs.mac && 'mac ' || '', inputs.e2e && 'e2e ' || '', inputs.install_check && 'install-check ' || '', inputs.win_platform && 'win-platform ' || '', inputs.win_e2e && format('win-e2e={0} ', inputs.win_e2e_grep) || '', inputs.installer_check && format('installer={0} ', inputs.legacy_tag) || '')) }}
  cancel-in-progress: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release: v') }}"

permissions:
  contents: read

jobs:
  # The queue's admission point (queue-gate.yml). A dispatch asking for macOS (`mac` or `e2e`) must come from main or a
  # MAC_REFS branch, and a dispatch whose commit already has a green run with the same inputs cancels itself. Skipped on
  # a push (nothing to admit), where the jobs below start at once. The jobs depend on it so a duplicate starts none.
  gate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write # cancels this run when its commit is already green
    uses: ./.github/workflows/queue-gate.yml
    with:
      workflow: ci.yml
      mac: ${{ inputs.mac || inputs.e2e }}
      mac-refs: ${{ vars.MAC_REFS }}
      force: ${{ inputs.force }}

  # What this run runs (scripts/ci-plan.ts): everything, or what the branch's change reaches; and how many shards each
  # vitest group gets, from the recorded cost of its files. Its summary says what it picked and why. The record and,
  # for a picked run, the test files go to the jobs below as the `test-plan` artifact, so every job deals its shard
  # from the same numbers. The whole history without blobs: the change is measured from where the branch left main.
  plan:
    needs: gate
    if: "!cancelled() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v'))"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      check: ${{ steps.plan.outputs.check }}
      win: ${{ steps.plan.outputs.win }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # The newest record this branch or main saved; without one the plan starts from the repository's snapshot.
      - name: Restore the recorded test timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/test-timings.json
          key: vitest-timings-${{ github.run_id }}
          restore-keys: vitest-timings-
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          MAC: ${{ inputs.mac }}
          # The Windows tests: pushes to main and batch runs; a pull request runs Linux alone.
          WINDOWS: ${{ github.event_name == 'push' || inputs.win_platform || inputs.batch }}
        run: bun scripts/ci-plan.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-plan
          path: .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Pre-flight: the same blocking checks release.yml runs (types, biome, surface
  # policy, vitest, Windows `test:platform`, macOS @smoke, `native` and
  # `mac-native`), in parallel on every push to main, so a release finds
  # nothing red that a push did not already
  # show. A `release: vX.Y.Z` push also starts release.yml, which runs them
  # again before packaging, so the push run would only repeat them. A failed
  # job writes its first error lines to its job summary (scripts/ci-failure.sh).
  #
  # Types, biome, the surface policy, and a test in every fix commit of the push
  # or pull request (scripts/lint-fix-tests.mjs; the full history without blobs).
  static:
    needs: gate
    if: "!cancelled() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run check:types
      - run: bunx biome check src e2e resources scripts
      - run: node scripts/lint-surfaces.mjs
      # A pushed range whose base git cannot find (a new branch, a dispatch) checks the head commit alone.
      - name: Fix commits carry a test
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$HEAD_SHA~1"; fi
          bun scripts/lint-fix-tests.mjs "$BASE..$HEAD_SHA"
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # vitest as release.yml's `check`: the node project and the renderer project, each in as many shards as `plan`
  # gave it, against the newest published omp: the tests that read the installed stock omp (its settings, provider
  # ids, tool renderers, the `*-stock` bridge suites) skip without one, and two omp releases in a row broke settings
  # copy that only a developer's run caught. omp-latest.yml runs the same daily, so a new omp shows without a push.
  # Each job writes what its files cost, for the record (`timings` below).
  check:
    name: check (${{ matrix.name }})
    needs: plan
    if: "!cancelled() && needs.plan.outputs.check != '' && needs.plan.outputs.check != '[]'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.check) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Tests import electron, whose index.js throws without the binary: the shared install fetches it.
      - uses: ./.github/actions/install
      - name: Install omp
        run: |
          # --minimum-release-age 0: the runner wants the newest omp, not bunfig.toml's 3-day hold.
          bun install -g --minimum-release-age 0 @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-plan
          path: .ci
      - run: bunx vitest run ${{ matrix.args }}
        env:
          OMPDESK_TEST_TIMINGS: .ci/test-timings.json
          OMPDESK_TEST_FILES: ${{ needs.plan.outputs.scope == 'changed' && '.ci/test-files.json' || '' }}
          OMPDESK_TEST_TIMINGS_OUT: .ci/out/check-${{ strategy.job-index }}.json
          OMPDESK_TEST_REPORT: test-report/vitest.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-check-${{ strategy.job-index }}
          path: .ci/out/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # The work card's verdict over 254 real cards and its generated invariants, by name, even when the run above
      # failed elsewhere: a red here is a card that changed colour or a check that changed its word
      # (src/renderer/components/chat/work/work-verdict-replay.test.tsx; `-u` only after reviewing each moved card).
      # A run that picks its tests by the change runs them above when the change reaches them.
      - name: Work card verdict over real journals
        if: ${{ !cancelled() && matrix.first && needs.plan.outputs.scope == 'full' }}
        run: bunx vitest run src/renderer/components/chat/work/work-verdict-replay.test.tsx src/renderer/components/chat/work/work-verdict.property.test.ts scripts/work-verdict-corpus.test.ts
        env:
          OMPDESK_TEST_REPORT: test-report/work-verdict.json
      # Each test's result, for check control (its reader finds the job by this id; only report files go in it).
      - name: Upload the test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ job.check_run_id }}
          path: test-report/
          if-no-files-found: ignore
          retention-days: 3
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The production build (also what the macOS job launches): release.yml's
  # `build` job.
  build:
    needs: gate
    if: "!cancelled() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run build
      - if: failure()
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # OMPdesk's own Rust (native/ompdesk): fmt (Linux), clippy and `cargo test` on
  # every OS it ships or tests on, as release.yml's `native`. A pull request runs
  # the Linux leg alone, a push to main and a batch run add Windows (the job `if`
  # cannot read the matrix, so the list itself depends on the event); the macOS
  # leg is in mac-checks.yml with the other macOS jobs. A run that picks by the
  # change skips it when the change touches nothing these checks read (`plan`).
  native:
    name: native (${{ matrix.name }})
    needs: plan
    if: "!cancelled() && needs.plan.outputs.native == 'true'"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]', '{"os":"ubuntu-latest","name":"linux"}', (github.event_name == 'push' || inputs.batch) && ',{"os":"windows-latest","name":"windows"}' || '')) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/native-check
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # release.yml's `win` pre-flight half: the tests outside src/renderer on
  # Windows (paths, PATH lookup, cmd.exe shims, spawn, named pipes, file modes),
  # in as many shards as `plan` gave them (none on a pull request, which runs Linux alone).
  win-platform:
    name: win-platform (${{ matrix.name }})
    needs: plan
    if: "!cancelled() && needs.plan.outputs.win != '' && needs.plan.outputs.win != '[]'"
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the failure report reads this run's jobs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.win) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-plan
          path: .ci
      # The longest files start first, by the same record the shards are dealt from (scripts/vitest-sequencer.ts):
      # without it the git-heavy files (disk care, autopilot) could start last and leave one worker alone at the end.
      - run: bun run test:platform ${{ matrix.args }}
        env:
          OMPDESK_TEST_TIMINGS: .ci/test-timings.json
          OMPDESK_TEST_FILES: ${{ needs.plan.outputs.scope == 'changed' && '.ci/test-files.json' || '' }}
          OMPDESK_TEST_TIMINGS_OUT: .ci/out/win-${{ strategy.job-index }}.json
          OMPDESK_TEST_REPORT: test-report/vitest.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-win-${{ strategy.job-index }}
          path: .ci/out/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # Each test's result, for check control (its reader finds the job by this id; only report files go in it).
      - name: Upload the test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ job.check_run_id }}
          path: test-report/
          if-no-files-found: ignore
          retention-days: 3
      - if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Keeps the record of what each test file costs: this run's measurements folded into the record the run started
  # from, saved for the next run's `plan` and uploaded as `test-timings` (scripts/test-timings.ts). Only a run of
  # everything saves it; a job that failed still leaves the files that passed.
  timings:
    needs: [plan, check, win-platform]
    if: "!cancelled() && needs.plan.outputs.scope == 'full'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-plan
          path: .ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: test-timings-*
          path: .ci/jobs
          merge-multiple: true
      - run: mkdir -p .ci/jobs && bun scripts/test-timings.ts merge .ci/test-timings.json .ci/jobs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings
          path: .ci/test-timings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/test-timings.json
          key: vitest-timings-${{ github.run_id }}-${{ github.run_attempt }}

  # The dispatched macOS checks as one unit (mac-checks.yml: mac-smoke, mac-native, memory, `native` on macOS arm64; a push
  # to main runs the same unit from mac-main.yml). macOS runners are the account's scarcest (5 at once), so a branch takes
  # them once, at its landing gate (`mac=true`), with the gate's admission (main or a MAC_REFS branch) and the
  # account-wide `mac-dispatch` lane: one holder, one waiting, a newer request replaces the waiting one
  # (cancel-in-progress false), so branch work never has more than one unit's runners open.
  mac:
    needs: gate
    if: "!cancelled() && github.event_name == 'workflow_dispatch' && inputs.mac && needs.gate.outputs.mac_ok == 'true'"
    concurrency:
      group: mac-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # the failure reports read this run's jobs
    uses: ./.github/workflows/mac-checks.yml

  # The manual full suite: the same sharded layout as release.yml's gate
  # (e2e-shards.yml). The shards need the app bundle, so it is built and
  # uploaded first, on Linux (the bundle is byte-identical on every OS).
  build-out:
    needs: gate
    if: "!cancelled() && inputs.e2e && needs.gate.outputs.mac_ok == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          electron: "false"
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out
          path: out/
          if-no-files-found: error
          retention-days: 1

  # Launches the built app: the full suite, against the latest published omp
  # (no provider credentials, each suite uses an isolated agent dir).
  e2e:
    needs: build-out
    concurrency:
      group: mac-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-shards.yml

  # The app's automatic setup (src/main/setup/) for real on a fresh Windows
  # profile: scripts/setup-install-check.ts runs Bun's installer, PortableGit
  # (the runner's preinstalled Git for Windows hidden, so the managed copy is
  # what omp finds) and `bun install -g` omp through the app's runner into a
  # temp USERPROFILE/BUN_INSTALL, then asserts omp is detected at the minimum
  # version, the registry PATH refresh saw Bun, and stock omp's shell is that
  # Git Bash, not cmd.exe.
  install-check:
    needs: gate
    if: "!cancelled() && inputs.install_check"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
      - run: bun scripts/setup-install-check.ts --hide-system-git

  # The packaged one-click, per-user setup (electron-builder.win.yml +
  # resources/installer.nsh) on a real Windows: scripts/windows-installer-check.ps1
  # runs `setup /S`, then the setup as a double-click runs it (no arguments;
  # it must finish with only a progress bar and start OMPdesk), then an
  # all-users install from `legacy_tag`'s assisted installer that the new
  # setup must remove. Each checks the install folder, the Start-menu and
  # desktop shortcuts, the uninstall entry (HKCU only), the app's first
  # window, and the uninstall. Captures land in the `installer-check` artifact.
  installer-check:
    needs: gate
    if: "!cancelled() && inputs.installer_check"
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
        with:
          builder: "true"
      - run: bun run build
      # The memory binary, built or restored from its cache and checked, as in release.yml's win job.
      - id: memory-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ai-memory-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/memory/**', 'scripts/build-memory.ts', 'resources/gui-bridge/memory-prompt.ts', 'resources/gui-bridge/redactor.ts') }}
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native/memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        name: Build the memory binary
        run: bun run build:memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ${{ steps.memory-cache.outputs.cache-primary-key }}
      - if: steps.memory-cache.outputs.cache-hit == 'true'
        name: Check the cached memory binary
        run: bun run build:memory -- --check
      - name: Unpack the pinned agent-desktop
        run: bun run build:agent-desktop
      - name: Package
        run: bunx electron-builder --config electron-builder.win.yml --win --x64 --publish never
      - name: Stage the setup under its release name and the assisted-installer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases before v0.42.0 were removed from GitHub: without the assisted-installer release the
        # all-users step is skipped with a warning instead of failing every other check.
        run: |
          set -euo pipefail
          cp "dist/ompdesk-$(node -p 'require("./package.json").version')-setup.exe" ompdesk-windows-setup.exe
          if gh release download "${{ inputs.legacy_tag }}" --pattern ompdesk-windows-setup.exe --output legacy-setup.exe; then
            ls -l ompdesk-windows-setup.exe legacy-setup.exe
          else
            echo "::warning::release ${{ inputs.legacy_tag }} not found: the all-users install step is skipped"
          fi
      - name: Silent install
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Setup ompdesk-windows-setup.exe -Mode silent
      - name: Double-click install
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Setup ompdesk-windows-setup.exe -Mode ui -Captures installer-captures
      - name: Over an all-users install
        if: hashFiles('legacy-setup.exe') != ''
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Setup ompdesk-windows-setup.exe -Mode legacy -LegacySetup legacy-setup.exe
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-check
          path: installer-captures/
          if-no-files-found: ignore
          retention-days: 7

  # Launches the built app on a real Windows desktop: the @smoke specs on the
  # fake omp (e2e/*.e2e.ts titles tagged @smoke) and, before them, the real
  # `bun install -g` update of an omp that is running
  # (scripts/omp-update-lock-check.ts). Each spec writes its captures under
  # captures/; they and Playwright's own results are uploaded on every run.
  win-e2e:
    needs: gate
    if: "!cancelled() && inputs.win_e2e"
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      E2E_GREP: ${{ inputs.win_e2e_grep || '@smoke' }}
      OMP_GUI_DESKTOP_CAPTURES: captures/desktop
      OMP_GUI_SETUP_CAPTURES: captures/setup
      OMP_GUI_SPLIT_SELECT_CAPTURES: captures/split-select
      OMP_GUI_SCM_CAPTURES: captures/source-control
      OMP_GUI_PREVIEW_SCREENSHOTS: captures/preview
      # e2e/real-ai-memory-windows.e2e.ts: the real ai-memory.exe and its HKCU logon entry on this (throwaway) runner.
      OMP_GUI_REAL_AI_MEMORY_SERVICE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # See release.yml's win job: bun's cache on the workspace volume.
      - name: Put bun's cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
        with:
          builder: "true"
      - run: bun run build
      # The memory binary, built or restored from its cache and checked, as in release.yml's win job.
      - id: memory-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ai-memory-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/memory/**', 'scripts/build-memory.ts', 'resources/gui-bridge/memory-prompt.ts', 'resources/gui-bridge/redactor.ts') }}
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native/memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        name: Build the memory binary
        run: bun run build:memory
      - if: steps.memory-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ai-memory-bin
          key: ${{ steps.memory-cache.outputs.cache-primary-key }}
      - if: steps.memory-cache.outputs.cache-hit == 'true'
        name: Check the cached memory binary
        run: bun run build:memory -- --check
      - name: Unpack the pinned agent-desktop
        run: bun run build:agent-desktop
      # e2e/first-launch-window.e2e.ts launches dist/win-unpacked/OMPdesk.exe, the packaged app whose memory sets its
      # real ai-memory service up (an unpacked dev run only reports), as release.yml's win job does after packaging.
      - name: Package (unpacked)
        run: bunx electron-builder --config electron-builder.win.yml --win --x64 --dir --publish never
      # Sysinternals Handle: the first-launch spec lists which process holds which libuv pipe after each quit.
      - name: Sysinternals Handle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Handle.zip -OutFile "$env:RUNNER_TEMP\Handle.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\Handle.zip" -DestinationPath "$env:RUNNER_TEMP\handle"
          $exe = Join-Path $env:RUNNER_TEMP 'handle\handle64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') {
            throw "handle64.exe is not signed by Microsoft: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          "OMP_GUI_HANDLE_EXE=$exe" >> $env:GITHUB_ENV
      - name: ai-memory, sidecar and packaging unit tests on Windows (staging, paths, the logon entry, the stop path)
        run: bunx vitest run src/main/ai-memory src/main/sidecar.test.ts src/main/packaging-config.test.ts
      # Real PowerShell, a real handle list and a real detached descendant (SpawnSpec.isolated); its own step, so its
      # C# compile does not load the timing-sensitive files above.
      - name: Setup runner unit tests on Windows (the supervisor, isolated commands)
        run: bunx vitest run src/main/setup/runner.test.ts
      - name: omp update while omp runs
        run: bun scripts/omp-update-lock-check.ts
      - name: Playwright browsers
        run: bunx playwright install chromium
      - name: Playwright e2e
        run: bunx playwright test --grep "$env:E2E_GREP"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows-captures
          path: |
            captures/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

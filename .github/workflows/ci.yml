# Typecheck, lint, unit/component tests on both supported platforms on every
# push and PR. Windows runs catch path, PATH-lookup, cmd.exe shim, and
# named-pipe assumptions that a Mac never exercises. Playwright e2e is slow, so
# it runs only on demand and when release.yml calls this workflow with `e2e`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      e2e:
        description: "Also run the Playwright e2e jobs"
        type: boolean
        default: false

# `github.workflow` is the caller's name under workflow_call, so a release run
# never cancels (or is cancelled by) the push run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bunx biome check src e2e
      - run: bunx vitest run
      - run: bun run build

  # Launches the built app. macOS runs the full suite: most suites drive the
  # fake omp in e2e/sidecar-fixture.ts; real-core, deep-audit, and the stats
  # route need the real omp, installed here with no provider credentials (each
  # suite uses an isolated agent dir). Windows runs the `@smoke` subset on the
  # fake omp (launch, named-pipe bridge, new tab, prompt round-trip, settings).
  e2e:
    if: inputs.e2e || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install omp
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bun install -g @oh-my-pi/pi-coding-agent
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/omp" --version
      - run: bun run build
      - if: runner.os == 'macOS'
        run: bunx playwright test
      - if: runner.os == 'Windows'
        run: bunx playwright test --grep "@smoke"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

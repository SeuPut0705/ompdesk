\* Variant B: the gate does not count the tool calls under way (freeze ignores `starting`). The invariant is the narrow one: a job is running at the quit.
CONSTANTS
    Omps = {o1, o2}
    CallsPer = 1
    MaxJobs = 1
    MaxRounds = 2
    CountStarting = FALSE
    RequireFrozen = TRUE
    Legacy = {}
    LeaseOutlastsRound = TRUE
SPECIFICATION Spec
INVARIANT NoRunningJobCutByQuit

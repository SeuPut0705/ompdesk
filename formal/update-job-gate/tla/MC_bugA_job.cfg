\* Variant A, the old code: a plain look (composer.jobs) on every omp, no gate, install when it shows no work. The invariant is the narrow one: a job is running at the quit.
CONSTANTS
    Omps = {o1, o2}
    CallsPer = 1
    MaxJobs = 1
    MaxRounds = 2
    CountStarting = FALSE
    RequireFrozen = FALSE
    Legacy = {o1, o2}
    LeaseOutlastsRound = TRUE
SPECIFICATION Spec
INVARIANT NoRunningJobCutByQuit

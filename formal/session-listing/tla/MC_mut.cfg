\* The mutation checker's config: MC.cfg with MaxChanges 2 instead of 3. Its unmutated model and the mutations that
\* name no config of their own run here. MC.cfg itself (3 tab changes) is a deep matrix run that takes more than 45
\* minutes on 4 cores, which the fast stamp could not afford; every one of those mutations is detected (or declared
\* equivalent) at 2 tab changes with the same verdicts. SCOPE.md says so.
CONSTANTS
    Devices = {d1, d2}
    Sessions = {"s1", "s2"}
    WinTabs = {"w1"}
    HostTabs = {"h1"}
    Opens <- OpensMC
    ClosedPair <- ClosedPairMC
    Idx0 <- IdxAllMC
    MaxChanges = 2
    MaxIdx = 0
    MaxTicks = 0
    MaxDrops = 0
    MaxForeign = 0
    MaxJ = 1
    MaxCh = 3
    LinkMode = "fifo"
    IpcMode = "free"
    Track = FALSE
SYMMETRY DevSym
SPECIFICATION Spec
INVARIANTS
    TypeOK
    HeldConverges
    OpenersConverge
    ListConverges
    NoReappear
    SameVersionSameRows
    OneAsk
    FreshAfterRequest

<!doctype html>
<html lang="en" data-platform="web">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>OMPdesk run-state composer prototypes</title>
		<!--
			Run-state prototypes (src/renderer/dev-harness/prototypes/run): ?variant=a|b|c|all &state=… &shell=desktop|phone|tablet
			&width= &height= &theme=light|dark &lang=en|ko. Before any module loads this maps ?shell= onto what the app's own
			shell-mode code reads: desktop is an Electron-like window (no data-shell), phone / tablet pin the real mode with
			touch input.
		-->
		<script>
			(function () {
				var query = new URLSearchParams(location.search);
				var theme = query.get("theme");
				var lang = query.get("lang");
				if (theme === "dark" || theme === "light") localStorage.setItem("omp.themeScheme", theme);
				if (lang === "en" || lang === "ko") localStorage.setItem("omp.lang", lang);
				var shell = query.get("shell") || "desktop";
				query.set("protoShell", shell);
				if (shell === "desktop") {
					document.documentElement.dataset.platform = "desktop";
					query.delete("shell");
				} else {
					query.set("shell", shell === "phone" ? "phone" : "tablet-portrait");
					query.set("input", "touch");
				}
				history.replaceState(null, "", location.pathname + "?" + query.toString());
			})();
		</script>
		<script src="./pre-paint.js"></script>
		<style>
			html {
				background: #fcfcfb;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./dev-harness/prototypes/run/main.tsx"></script>
	</body>
</html>
